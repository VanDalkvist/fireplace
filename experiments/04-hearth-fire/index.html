<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Салон присутствия — 04: Живой созерцательный очаг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      color: #ece4d6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 178, 102, 0.12);
      border: 1px solid rgba(255, 178, 102, 0.35);
      color: #ffb266;
      border-radius: 2px;
      font-weight: 700;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #ffb266;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb266;
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.4;
      background: #050505;
      border: 1px solid #181410;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: default; }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
    }
    button {
      background: #14100c;
      border: 1px solid #2a2016;
      color: #ece4d6;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #221810; border-color: #ffb266; color: #fff; }
    button.active { background: #ffb266; border-color: #ffb266; color: #050505; font-weight: 700; }
    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .chip {
      background: #100d0a;
      border: 1px solid #241c14;
      color: #8a7e70;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: #ffb266; color: #ffb266; }
    .info-bar {
      font-size: 10.5px;
      color: #706354;
      line-height: 1.6;
      padding: 0 4px;
    }
    .info-bar kbd {
      background: #15110d;
      border: 1px solid #2b2117;
      padding: 1px 4px;
      border-radius: 2px;
      color: #ece4d6;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge"><span class="dot"></span> эксперимент 04</span>
      <span style="font-weight: 600; color:#ece4d6;">созерцательный очаг присутствия</span>
      <span style="color:#605345;">· живой пляшущий огонь</span>
    </div>
    <div id="statusLabel" style="color:#ffb266;">02 · круг чувств · голос в круге</div>
  </div>

  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls">
    <button id="btnNext" class="active">
      <span>space</span> реплика в круг (рандом)
    </button>
    <button id="btnAutoDemo">
      <span>▶</span> медитативный живой круг
    </button>
    <button id="btnAudio">
      <span>m</span> звук d dorian
    </button>
    <div style="display:flex; gap:4px; margin-left: 8px;">
      <button class="phase-btn" data-phase="1">1 тишина</button>
      <button class="phase-btn active" data-phase="2">2 чувства</button>
      <button class="phase-btn" data-phase="3">3 желания</button>
      <button class="phase-btn" data-phase="4">4 выход</button>
    </div>
    <div class="phrase-chips">
      <span style="font-size:10px; color:#584b3d; margin-right:4px;">в общее поле:</span>
      <button class="chip" data-text="тревога" data-family="тревога">тревожно</button>
      <button class="chip" data-text="замедление" data-family="спокойствие">замедление</button>
      <button class="chip" data-text="тепло" data-family="нежность">тепло</button>
      <button class="chip" data-text="усталость" data-family="усталость">устал</button>
      <button class="chip" data-text="тишины" data-kind="desire">тишины</button>
      <button class="chip" data-text="пас" data-kind="pass">пас</button>
    </div>
  </div>

  <div class="info-bar">
    <kbd>space</kbd> — реплика попадает в общее поле вокруг огня · слова остывают со временем до 10% · <kbd>m</kbd> — звук дрона
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const statusLabel = document.getElementById('statusLabel');
  const btnAudio = document.getElementById('btnAudio');
  const btnNext = document.getElementById('btnNext');
  const btnAutoDemo = document.getElementById('btnAutoDemo');

  const TAU = Math.PI * 2;
  const SEATS_COUNT = 12;

  let W, H, cx, floorCY, floorRx, floorRy;
  let activeSeat = 0;
  let lastSpeakerSeat = null;
  let phase = 2; // 1: silence, 2: feelings, 3: desires, 4: completion

  // True Isometric Perspective
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.round(rect.width * dpr);
    H = canvas.height = Math.round(rect.height * dpr);

    cx = W / 2;
    floorCY = H * 0.65;
    floorRx = Math.min(W * 0.41, 490 * dpr);
    floorRy = Math.min(H * 0.20, 140 * dpr);

    layoutSeats();
  }

  const seats = [];
  function layoutSeats() {
    seats.length = 0;
    for (let i = 0; i < SEATS_COUNT; i++) {
      const ang = (i / SEATS_COUNT) * TAU + Math.PI / 2;
      const x = cx + Math.cos(ang) * floorRx;
      const y = floorCY + Math.sin(ang) * floorRy;
      const depth = (Math.sin(ang) + 1) / 2; // 0 (far) .. 1 (near)

      seats.push({
        id: i,
        angle: ang,
        x,
        y,
        depth,
        pulse: 0,
        spokenCount: 0,
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // =========================================================================
  // DYNAMIC LIVING HEARTH (Multi-tongue leaping fire with organic 1/f draft)
  // =========================================================================

  // Burning firewood logs in the firepit (star/teepee formation)
  const LOGS = [
    { a: -0.65, len: 64, w: 7, heatPhase: 0.0, speed: 1.6 },
    { a: 0.85,  len: 62, w: 6.5, heatPhase: 2.1, speed: 2.0 },
    { a: 2.35,  len: 66, w: 7, heatPhase: 4.2, speed: 1.4 },
    { a: 3.85,  len: 60, w: 6.5, heatPhase: 1.3, speed: 1.8 }
  ];

  // 8 Organic Flame Tongues rooted at different logs & crossing points
  // They flare up and subside asynchronously, making the flame hop naturally across logs!
  const TONGUES = [
    // Central main plumes
    { relX: -4,  relY: -2, width: 26, baseH: 78, speed: 2.2, phase: 0.0, layer: 'core' },
    { relX: 6,   relY: 3,  width: 24, baseH: 74, speed: 1.9, phase: 1.8, layer: 'core' },
    // Left flank tongues
    { relX: -20, relY: 2,  width: 18, baseH: 58, speed: 2.7, phase: 3.2, layer: 'body' },
    { relX: -14, relY: -7, width: 16, baseH: 48, speed: 3.1, phase: 5.1, layer: 'mantle' },
    // Right flank tongues
    { relX: 18,  relY: 1,  width: 19, baseH: 60, speed: 2.5, phase: 2.4, layer: 'body' },
    { relX: 13,  relY: -6, width: 15, baseH: 50, speed: 3.3, phase: 4.3, layer: 'mantle' },
    // Back and front tongues
    { relX: -2,  relY: -10, width: 20, baseH: 52, speed: 2.1, phase: 0.9, layer: 'mantle' },
    { relX: 3,   relY: 8,   width: 22, baseH: 42, speed: 2.8, phase: 3.7, layer: 'body' }
  ];

  // Detaching micro-licks (small tongues breaking off the fire and rising)
  const LICKS_COUNT = 8;
  const licks = [];
  function createLick() {
    return {
      x: cx + (Math.random() - 0.5) * 22,
      y: floorCY - 25 - Math.random() * 20,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.9 - Math.random() * 1.5,
      size: 4 + Math.random() * 6,
      life: 0,
      maxLife: 20 + Math.random() * 25,
      curlPhase: Math.random() * TAU
    };
  }
  for (let i = 0; i < LICKS_COUNT; i++) {
    const lk = createLick();
    lk.life = Math.random() * lk.maxLife;
    licks.push(lk);
  }

  // Soft Volumetric Heat Puffs (glowing internal light body)
  const PUFF_COUNT = 22;
  const flamePuffs = [];
  function createPuff() {
    return {
      x: cx + (Math.random() - 0.5) * 24,
      y: floorCY + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.7 - Math.random() * 1.4,
      size: 15 + Math.random() * 18,
      life: Math.random() * 40,
      maxLife: 32 + Math.random() * 28,
      hue: Math.random() < 0.65 ? 'amber' : 'carmine'
    };
  }
  for (let i = 0; i < PUFF_COUNT; i++) {
    flamePuffs.push(createPuff());
  }

  // Gentle Floating Sparks dancing in convection air
  const SPARK_COUNT = 45;
  const hearthSparks = [];
  function createHearthSpark() {
    const ang = Math.random() * TAU;
    const rx = Math.random() * 26;
    const ry = Math.random() * 9;
    return {
      x: cx + Math.cos(ang) * rx,
      y: floorCY + Math.sin(ang) * ry,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.6 - Math.random() * 1.5,
      size: 1.0 + Math.random() * 1.8,
      life: Math.random() * 130,
      maxLife: 75 + Math.random() * 115,
      swirl: Math.random() * TAU
    };
  }
  for (let i = 0; i < SPARK_COUNT; i++) {
    hearthSparks.push(createHearthSpark());
  }

  // =========================================================================
  // SHARED HEARTH WORDS: Placed in the clearing ring WITH SACRED FIRE CLEARANCE
  // =========================================================================

  const words = [];
  const flightSparks = [];
  let lastSpokenWord = null;

  function recordLinkInStorage(srcWord, tgtWord) {
    try {
      const key = 'salon_presence_links';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.push({
        fromSeat: srcWord.seatId,
        toSeat: tgtWord.seatId,
        fromWord: srcWord.text,
        toWord: tgtWord.text,
        phase,
        timestamp: Date.now()
      });
      if (existing.length > 200) existing.splice(0, existing.length - 200);
      localStorage.setItem(key, JSON.stringify(existing));
    } catch (e) {}
  }

  function agePreviousWords() {
    for (let i = 0; i < words.length; i++) {
      words[i].opacity = Math.max(0.10, words[i].opacity - 0.02);
    }
  }

  function pickRandomSpeaker(excludeSeat) {
    const candidates = [];
    for (let i = 0; i < SEATS_COUNT; i++) {
      if (i !== excludeSeat) {
        const dist = Math.abs(i - excludeSeat);
        if (dist >= 2 && dist <= (SEATS_COUNT - 2)) {
          candidates.push(i);
          candidates.push(i);
        } else {
          candidates.push(i);
        }
      }
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  // Sacred Fire Clearance & Collision-Free Placement in the Clearing
  function findComfortableHearthSlot(speakerAngle, wordWidth) {
    // Distance from center: 52% .. 74% of clearing radius
    // CRITICAL: Must maintain at least 95px horizontal and 48px vertical clearance from (cx, floorCY)
    // so words NEVER touch or overlap the campfire flames!
    const baseR = 0.58;
    const halfW = wordWidth / 2;

    let bestX = cx + Math.cos(speakerAngle) * (floorRx * baseR);
    let bestY = floorCY + Math.sin(speakerAngle) * (floorRy * baseR);

    let attempts = 0;
    while (attempts < 28) {
      const angleShift = (attempts === 0 ? 0 : (attempts % 2 === 0 ? 1 : -1) * Math.ceil(attempts / 2) * 0.20);
      const testAng = speakerAngle + angleShift;
      // Organically stagger between inner and outer ring of the clearing
      const testR = baseR + ((attempts % 3) - 1) * 0.09;

      let testX = cx + Math.cos(testAng) * (floorRx * testR);
      let testY = floorCY + Math.sin(testAng) * (floorRy * testR);

      // Enforce strict clearance from the campfire & flame height!
      const distFireX = Math.abs(testX - cx);
      const distFireY = testY - floorCY; // negative is above fire (where flames rise!)

      // If word is in the flame zone (above hearth and close horizontally)
      if (distFireX < (90 + halfW) && distFireY < 32 && distFireY > -105) {
        // Push word outward safely
        if (distFireX < (90 + halfW)) {
          testX = cx + (testX >= cx ? 1 : -1) * (100 + halfW);
        }
      }

      // Check collision against all existing words
      let overlaps = false;
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        const dx = Math.abs(testX - w.targetX);
        const dy = Math.abs(testY - w.targetY);
        if (dx < (halfW + w.width / 2 + 18) && dy < 18) {
          overlaps = true;
          break;
        }
      }

      if (!overlaps) {
        bestX = testX;
        bestY = testY;
        break;
      }
      attempts++;
    }

    return { x: bestX, y: bestY };
  }

  function addWord(text, family, kind = 'feeling', chosenSeat = null) {
    const prevSpeaker = activeSeat;
    const speakerSeat = chosenSeat !== null && chosenSeat !== undefined
      ? chosenSeat
      : pickRandomSpeaker(prevSpeaker);

    activeSeat = speakerSeat;
    const seat = seats[activeSeat];
    seat.pulse = 1.0;
    seat.spokenCount++;

    const now = performance.now();
    agePreviousWords();

    if (kind === 'pass') {
      seat.hasPassed = true;
      if (audioOn) playPass();
      lastSpeakerSeat = activeSeat;
      updateStatus();
      return;
    }

    ctx.font = "12px 'JetBrains Mono'";
    const textMetrics = ctx.measureText(text);
    const wordWidth = textMetrics.width;

    let existing = words.find(w => w.text === text && w.seatId === activeSeat);
    if (existing) {
      existing.count++;
      existing.lastAt = now;
      existing.pulse = 1.0;
      existing.opacity = 1.0;

      if (lastSpokenWord && lastSpokenWord !== existing) {
        recordLinkInStorage(lastSpokenWord, existing);
      }

      lastSpokenWord = existing;
      lastSpeakerSeat = activeSeat;

      if (audioOn) playChime(activeSeat);
      updateStatus();
      return;
    }

    const slot = findComfortableHearthSlot(seat.angle, wordWidth);

    const newWord = {
      text,
      family: family || 'спокойствие',
      seatId: activeSeat,
      width: wordWidth,
      x: seat.x,
      y: seat.y,
      targetX: slot.x,
      targetY: slot.y,
      born: now,
      lastAt: now,
      pulse: 1.0,
      count: 1,
      settled: false,
      opacity: 1.0,
      breathOffset: Math.random() * TAU,
    };

    if (lastSpokenWord) {
      recordLinkInStorage(lastSpokenWord, newWord);
    }

    words.push(newWord);

    flightSparks.push({
      sx: seat.x, sy: seat.y,
      tx: slot.x, ty: slot.y,
      born: now, duration: 1200
    });

    lastSpokenWord = newWord;
    lastSpeakerSeat = activeSeat;

    if (audioOn) {
      if (kind === 'desire') playBell();
      else playChime(activeSeat);
    }
    updateStatus();
  }

  function updateStatus() {
    const phases = ['01 · тишина', '02 · круг чувств', '03 · чего хочется', '04 · выход'];
    const prevStr = lastSpeakerSeat !== null ? `от [${String(lastSpeakerSeat + 1).padStart(2, '0')}] к ` : '';
    statusLabel.textContent = `${phases[phase - 1]} · ${prevStr}место [${String(activeSeat + 1).padStart(2, '0')}]`;
  }

  // Audio Engine: Procedural D Dorian Drone
  let audioCtx = null;
  let audioOn = false;
  let droneGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.connect(audioCtx.destination);

    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime);

    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(293.66, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(320, audioCtx.currentTime);

    const subGain = audioCtx.createGain();
    subGain.gain.value = 0.35;
    osc2.connect(subGain);
    subGain.connect(filter);
    osc1.connect(filter);
    filter.connect(droneGain);

    osc1.start();
    osc2.start();
  }

  function toggleAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    btnAudio.classList.toggle('active', audioOn);
    if (audioOn) {
      droneGain.gain.setTargetAtTime(0.07, audioCtx.currentTime, 1.5);
    } else {
      droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
  }

  function playChime(seatIdx) {
    if (!audioCtx || !audioOn) return;
    const notes = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66];
    const freq = notes[seatIdx % notes.length] * 2;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.11, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 3.4);
  }

  function playBell() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.8);
  }

  function playPass() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110.0, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.2);
  }

  btnAudio.addEventListener('click', toggleAudio);

  // =========================================================================
  // MAIN RENDER LOOP: Living, Balanced, Breathing Hearth
  // =========================================================================

  function render(time) {
    const t = time * 0.001;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // 1. Dark warm clearing background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 2. Isometric Clearing Rings on Ground
    ctx.save();
    for (let k = 1; k <= 3; k++) {
      const rx = floorRx * (0.35 + k * 0.22);
      const ry = floorRy * (0.35 + k * 0.22);
      ctx.strokeStyle = k === 2 ? 'rgba(255, 178, 102, 0.035)' : 'rgba(236, 228, 214, 0.015)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, floorCY, rx, ry, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // 3. Ambient Ground Light Pool (Gentle 1/f thermal breathing ~0.12 Hz)
    const breath = Math.sin(t * 0.75) * 0.03 + Math.sin(t * 1.5) * 0.015;
    const poolRadiusX = 145 * (1.0 + breath);
    const poolRadiusY = 52 * (1.0 + breath);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const poolGrad = ctx.createRadialGradient(cx, floorCY, 0, cx, floorCY, poolRadiusX);
    poolGrad.addColorStop(0.0, 'rgba(255, 200, 140, 0.18)');
    poolGrad.addColorStop(0.45, 'rgba(215, 110, 40, 0.10)');
    poolGrad.addColorStop(0.78, 'rgba(110, 25, 8, 0.03)');
    poolGrad.addColorStop(1.0, 'rgba(5, 5, 5, 0.0)');
    ctx.fillStyle = poolGrad;
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, poolRadiusX * 1.4, poolRadiusY * 1.4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 4. Hearth Bed: Ash Bed, River Stones & Charred Firewood Logs
    ctx.save();
    // Ash bed
    ctx.fillStyle = '#0b0806';
    ctx.beginPath();
    ctx.ellipse(cx, floorCY + 3, 50, 17, 0, 0, TAU);
    ctx.fill();

    // River stones ring around hearth
    const stoneCount = 10;
    for (let i = 0; i < stoneCount; i++) {
      const sAng = (i / stoneCount) * TAU + 0.2;
      const sx = cx + Math.cos(sAng) * 44;
      const sy = floorCY + 3 + Math.sin(sAng) * 15;
      ctx.fillStyle = i % 2 === 0 ? '#15100c' : '#1c1510';
      ctx.beginPath();
      ctx.ellipse(sx, sy, 5, 3, sAng, 0, TAU);
      ctx.fill();
    }

    // Charred burning logs with internal heat
    for (let i = 0; i < LOGS.length; i++) {
      const lg = LOGS[i];
      const lx1 = cx + Math.cos(lg.a) * (lg.len * 0.5);
      const ly1 = floorCY + 3 + Math.sin(lg.a) * (lg.len * 0.18);
      const lx2 = cx - Math.cos(lg.a) * (lg.len * 0.5);
      const ly2 = floorCY + 3 - Math.sin(lg.a) * (lg.len * 0.18);

      ctx.strokeStyle = '#140f0a';
      ctx.lineWidth = lg.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lx1, ly1);
      ctx.lineTo(lx2, ly2);
      ctx.stroke();

      // Pulsating glowing crevice on each log
      const logHeat = Math.sin(t * lg.speed + lg.heatPhase) * 0.2 + 0.7;
      ctx.strokeStyle = `rgba(245, 115, 30, ${logHeat * 0.75})`;
      ctx.lineWidth = lg.w * 0.35;
      ctx.beginPath();
      ctx.moveTo(cx + (lx1 - cx) * 0.35, floorCY + 3 + (ly1 - (floorCY + 3)) * 0.35);
      ctx.lineTo(cx + (lx2 - cx) * 0.35, floorCY + 3 + (ly2 - (floorCY + 3)) * 0.35);
      ctx.stroke();
    }
    ctx.restore();

    // 5. LIVING, BALANCED, MULTI-TONGUE FLAME (Leaping naturally between logs)
    // Wandering gentle breeze: balanced at 0, drifts left & right naturally
    const globalWind = Math.sin(t * 0.45) * 4.5 + Math.sin(t * 1.1) * 2.0;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < TONGUES.length; i++) {
      const fl = TONGUES[i];

      // Evolving activity cycle: tongues flare up, leap, and subside asynchronously!
      // This creates the hypnotic "leaping from one log to another" flame life!
      const cycle = Math.sin(t * fl.speed + fl.phase);
      const cycle2 = Math.sin(t * (fl.speed * 1.6) + fl.phase * 1.4);
      const activity = Math.max(0.18, (cycle * 0.55 + cycle2 * 0.35 + 0.55)); // 0.18 .. 1.45

      const localSway = Math.sin(t * (fl.speed * 1.3) + fl.phase) * 5 + globalWind;
      const stretch = (fl.baseH * (0.65 + activity * 0.45));
      const width = fl.width * (0.75 + activity * 0.35);

      const baseX = cx + fl.relX;
      const baseY = floorCY + fl.relY;
      const tipX = cx + fl.relX * 0.4 + localSway;
      const tipY = floorCY - stretch;

      // Organic Bezier curvature with flicking tip
      const flick = Math.sin(t * 4.2 + fl.phase) * 3;
      const cpLeftX = baseX - width * 0.55 + localSway * 0.35;
      const cpLeftY = floorCY - stretch * 0.42;
      const cpRightX = baseX + width * 0.55 + localSway * 0.35;
      const cpRightY = floorCY - stretch * 0.42;

      ctx.beginPath();
      ctx.moveTo(baseX - width * 0.42, baseY);
      ctx.bezierCurveTo(cpLeftX, cpLeftY, tipX - 2 + flick, tipY + 8, tipX + flick, tipY);
      ctx.bezierCurveTo(tipX + 2 + flick, tipY + 8, cpRightX, cpRightY, baseX + width * 0.42, baseY);
      ctx.closePath();

      // Layered blackbody gradient based on flame layer and current activity
      const flameGrad = ctx.createLinearGradient(baseX, baseY, tipX, tipY);
      const actAlpha = Math.min(1.0, activity);

      if (fl.layer === 'core') {
        flameGrad.addColorStop(0.0, `rgba(255, 245, 210, ${0.72 * actAlpha})`);
        flameGrad.addColorStop(0.35, `rgba(255, 185, 80, ${0.55 * actAlpha})`);
        flameGrad.addColorStop(0.78, `rgba(225, 75, 22, ${0.28 * actAlpha})`);
        flameGrad.addColorStop(1.0, 'rgba(160, 30, 10, 0.0)');
      } else if (fl.layer === 'body') {
        flameGrad.addColorStop(0.0, `rgba(255, 205, 110, ${0.52 * actAlpha})`);
        flameGrad.addColorStop(0.48, `rgba(240, 125, 38, ${0.38 * actAlpha})`);
        flameGrad.addColorStop(0.85, `rgba(190, 45, 15, ${0.16 * actAlpha})`);
        flameGrad.addColorStop(1.0, 'rgba(100, 20, 5, 0.0)');
      } else {
        // Outer glowing mantle
        flameGrad.addColorStop(0.0, `rgba(240, 135, 45, ${0.36 * actAlpha})`);
        flameGrad.addColorStop(0.55, `rgba(195, 65, 20, ${0.20 * actAlpha})`);
        flameGrad.addColorStop(1.0, 'rgba(85, 15, 5, 0.0)');
      }

      ctx.fillStyle = flameGrad;
      ctx.fill();
    }
    ctx.restore();

    // 6. Detaching Micro-Licks (Popping off active tongues and curling)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < licks.length; i++) {
      const lk = licks[i];
      lk.life++;
      if (lk.life >= lk.maxLife) {
        Object.assign(lk, createLick());
      }
      const p = lk.life / lk.maxLife;
      const curl = Math.sin(t * 3.5 + lk.curlPhase) * 0.45;
      lk.x += lk.vx + curl + globalWind * 0.05;
      lk.y += lk.vy;

      const alpha = p < 0.25 ? p / 0.25 : (1.0 - p);
      const curR = lk.size * (1 - p * 0.6);

      const lickGrad = ctx.createRadialGradient(lk.x, lk.y, 0, lk.x, lk.y, curR);
      lickGrad.addColorStop(0, `rgba(255, 220, 140, ${alpha * 0.65})`);
      lickGrad.addColorStop(0.6, `rgba(235, 120, 35, ${alpha * 0.35})`);
      lickGrad.addColorStop(1, 'rgba(160, 40, 10, 0)');

      ctx.fillStyle = lickGrad;
      ctx.beginPath();
      ctx.arc(lk.x, lk.y, curR, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 7. Volumetric Warmth Puffs (Internal soft heat glow)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flamePuffs.length; i++) {
      const p = flamePuffs[i];
      p.life++;
      if (p.life >= p.maxLife) {
        Object.assign(p, createPuff());
      }
      const progress = p.life / p.maxLife;
      p.x += p.vx + Math.sin(t * 2.8 + p.y * 0.04) * 0.2 + globalWind * 0.03;
      p.y += p.vy;

      const alpha = progress < 0.25 ? progress / 0.25 : (1.0 - progress);
      const rad = p.size * (1 - progress * 0.45);

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      if (p.hue === 'amber') {
        grad.addColorStop(0, `rgba(255, 215, 130, ${alpha * 0.32})`);
        grad.addColorStop(0.6, `rgba(240, 120, 40, ${alpha * 0.16})`);
        grad.addColorStop(1, 'rgba(180, 40, 10, 0)');
      } else {
        grad.addColorStop(0, `rgba(240, 130, 40, ${alpha * 0.22})`);
        grad.addColorStop(0.7, `rgba(180, 40, 10, ${alpha * 0.08})`);
        grad.addColorStop(1, 'rgba(80, 15, 5, 0)');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 8. Gentle Floating Sparks
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < hearthSparks.length; i++) {
      const sp = hearthSparks[i];
      sp.life++;
      if (sp.life >= sp.maxLife) {
        Object.assign(sp, createHearthSpark());
      }
      const p = sp.life / sp.maxLife;
      const swirl = Math.sin(t * 1.8 + sp.swirl) * 0.35;
      sp.vx = (sp.vx + swirl * 0.04 + globalWind * 0.02) * 0.96;
      sp.x += sp.vx;
      sp.y += sp.vy;

      const alpha = p < 0.25 ? p / 0.25 : (1.0 - p);
      ctx.fillStyle = p < 0.4
        ? `rgba(255, 230, 180, ${alpha * 0.85})`
        : `rgba(255, 160, 70, ${alpha * 0.65})`;

      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size * (1 - p * 0.3), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 9. Transient Flight Sparks: from seat to word position
    for (let i = flightSparks.length - 1; i >= 0; i--) {
      const sp = flightSparks[i];
      const elapsed = now - sp.born;
      if (elapsed >= sp.duration) {
        flightSparks.splice(i, 1);
        continue;
      }
      const q = elapsed / sp.duration;
      const ease = 1 - Math.pow(1 - q, 3);
      const midX = (sp.sx + sp.tx) / 2;
      const midY = Math.min(sp.sy, sp.ty) - 28;
      const u = 1 - ease;
      const x = u * u * sp.sx + 2 * u * ease * midX + ease * ease * sp.tx;
      const y = u * u * sp.sy + 2 * u * ease * midY + ease * ease * sp.ty;

      ctx.save();
      ctx.fillStyle = `rgba(255, 178, 102, ${0.85 * (1 - q * 0.7)})`;
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, 2.0 * (1 - q * 0.5), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // 10. Draw Seats Ring (Quiet outer circle of participants)
    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      const isActive = i === activeSeat;
      if (s.pulse > 0) s.pulse -= 0.02;

      const baseR = 3.2 + s.depth * 2.2;

      ctx.beginPath();
      ctx.arc(s.x, s.y, isActive ? baseR + 2 : baseR, 0, TAU);
      ctx.fillStyle = isActive ? '#ffb266' : s.spokenCount > 0 ? '#8a6e52' : '#221912';
      ctx.fill();

      if (isActive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, baseR + 7 + Math.sin(t * 3) * 1.2, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (s.hasPassed) {
        ctx.fillStyle = '#34281d';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 11, 2.5, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = isActive ? '#ffb266' : '#4d3d2f';
      ctx.font = '9.5px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelDist = 18 + s.depth * 8;
      const lx = s.x + Math.cos(s.angle) * labelDist;
      const ly = s.y + Math.sin(s.angle) * (labelDist * 0.6);
      ctx.fillText(`[${String(i + 1).padStart(2, '0')}]`, lx, ly);
    }

    // 11. Update & Render Shared Words (COMFORTABLY SPACED AROUND FIRE, NO FRAMES, FADING TO 10%)
    for (let i = 0; i < words.length; i++) {
      const w = words[i];

      if (!w.settled) {
        w.x += (w.targetX - w.x) * 0.06;
        w.y += (w.targetY - w.y) * 0.06;
        if (Math.hypot(w.targetX - w.x, w.targetY - w.y) < 1.2) {
          w.settled = true;
        }
      } else {
        w.y = w.targetY + Math.sin(t * 0.7 + w.breathOffset) * 0.7;
      }

      ctx.save();
      ctx.translate(w.x, w.y);

      const label = w.count > 1 ? `${w.text} ×${w.count}` : w.text;
      ctx.font = "12px 'JetBrains Mono'";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const isLatest = w === lastSpokenWord;
      const alpha = Math.max(0.10, w.opacity);

      if (isLatest) {
        ctx.fillStyle = `rgba(255, 185, 115, ${alpha})`;
        ctx.shadowColor = 'rgba(255, 178, 102, 0.60)';
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = `rgba(236, 228, 214, ${alpha * 0.88})`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 3;
      }

      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // =========================================================================
  // NATURAL RANDOM CONVERSATION LOOP
  // =========================================================================

  const RICH_LEXICON = [
    { text: 'замедление', family: 'спокойствие' },
    { text: 'волнение в груди', family: 'тревога' },
    { text: 'ком в горле', family: 'тело' },
    { text: 'тепло от ваших слов', family: 'нежность' },
    { text: 'сильная усталость', family: 'усталость' },
    { text: 'растерянность', family: 'растерянность' },
    { text: 'благодарность за честность', family: 'нежность' },
    { text: 'отпускает напряжение', family: 'спокойствие' },
    { text: 'пас', kind: 'pass' },
    { text: 'живость', family: 'радость' },
    { text: 'глубокий вдох', family: 'тело' },
    { text: 'ясность', family: 'спокойствие' },
    { text: 'тишины и выдоха', family: 'спокойствие', kind: 'desire' },
    { text: 'побыть с собой', family: 'спокойствие', kind: 'desire' },
    { text: 'просто помолчать рядом', family: 'нежность', kind: 'desire' },
    { text: 'тепла в теле', family: 'тело', kind: 'desire' }
  ];

  let turnCount = 0;
  let autoTimer = null;

  function triggerNextTurn() {
    const item = RICH_LEXICON[turnCount % RICH_LEXICON.length];
    turnCount++;

    if (turnCount > 8 && turnCount <= 12 && phase !== 3) {
      setPhase(3);
    } else if (turnCount > 12 && phase !== 4) {
      setPhase(4);
    }

    const nextSpeaker = pickRandomSpeaker(activeSeat);
    addWord(item.text, item.family, item.kind || 'feeling', nextSpeaker);
  }

  function toggleAutoDemo() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
    } else {
      btnAutoDemo.classList.add('active');
      const step = () => {
        triggerNextTurn();
        autoTimer = setTimeout(step, 5500);
      };
      step();
    }
  }

  function setPhase(p) {
    phase = p;
    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.phase, 10) === phase);
    });
    updateStatus();
  }

  // Interactivity
  btnNext.addEventListener('click', triggerNextTurn);
  btnAutoDemo.addEventListener('click', toggleAutoDemo);

  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.addEventListener('click', () => setPhase(parseInt(btn.dataset.phase, 10)));
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const nextSpeaker = pickRandomSpeaker(activeSeat);
      addWord(chip.dataset.text, chip.dataset.family, chip.dataset.kind || 'feeling', nextSpeaker);
    });
  });

  // Click seat to focus
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      if (Math.hypot(clickX - s.x, clickY - s.y) < 28) {
        activeSeat = i;
        s.pulse = 1.0;
        updateStatus();
        break;
      }
    }
  });

  // Keyboard Hotkeys
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      triggerNextTurn();
    } else if (e.key === 'm' || e.key === 'ь') {
      toggleAudio();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      setPhase(parseInt(e.key, 10));
    }
  });

  requestAnimationFrame(render);
})();
</script>

</body>
