<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Салон присутствия — 04: Цифровой созерцательный костёр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      color: #ece4d6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 178, 102, 0.12);
      border: 1px solid rgba(255, 178, 102, 0.35);
      color: #ffb266;
      border-radius: 2px;
      font-weight: 700;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #ffb266;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb266;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050505;
      border: 1px solid #1a1612;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: default; }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
    }
    button {
      background: #14100c;
      border: 1px solid #2a2016;
      color: #ece4d6;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #221810; border-color: #ffb266; color: #fff; }
    button.active { background: #ffb266; border-color: #ffb266; color: #050505; font-weight: 700; }
    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .chip {
      background: #100d0a;
      border: 1px solid #241c14;
      color: #8a7e70;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: #ffb266; color: #ffb266; }
    .info-bar {
      font-size: 10.5px;
      color: #706354;
      line-height: 1.6;
      padding: 0 4px;
    }
    .info-bar kbd {
      background: #15110d;
      border: 1px solid #2b2117;
      padding: 1px 4px;
      border-radius: 2px;
      color: #ece4d6;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge"><span class="dot"></span> эксперимент 04</span>
      <span style="font-weight: 600; color:#ece4d6;">цифровой костёр присутствия</span>
      <span style="color:#605345;">· s1 digital hearth</span>
    </div>
    <div id="statusLabel" style="color:#ffb266;">02 · круг чувств · место 01</div>
  </div>

  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls">
    <button id="btnNext" class="active">
      <span>space</span> реплика круга
    </button>
    <button id="btnAutoDemo">
      <span>▶</span> авто-круг
    </button>
    <button id="btnAudio">
      <span>m</span> звук d dorian
    </button>
    <div style="display:flex; gap:4px; margin-left: 8px;">
      <button class="phase-btn" data-phase="1">1 тишина</button>
      <button class="phase-btn active" data-phase="2">2 чувства</button>
      <button class="phase-btn" data-phase="3">3 желания</button>
      <button class="phase-btn" data-phase="4">4 выход</button>
    </div>
    <div class="phrase-chips">
      <span style="font-size:10px; color:#584b3d; margin-right:4px;">подбросить слово:</span>
      <button class="chip" data-text="тревога" data-family="тревога">тревожно</button>
      <button class="chip" data-text="замедление" data-family="спокойствие">замедление</button>
      <button class="chip" data-text="тепло" data-family="нежность">тепло</button>
      <button class="chip" data-text="усталость" data-family="усталость">устал</button>
      <button class="chip" data-text="тишины" data-kind="desire">✦ тишины</button>
      <button class="chip" data-text="пас" data-kind="pass">пас</button>
    </div>
  </div>

  <div class="info-bar">
    <kbd>space</kbd> — сказать реплику и передать эстафету · <kbd>клик по стулу</kbd> — переместить фокус говорящего · <kbd>m</kbd> — звук дрона · <kbd>1..4</kbd> — фазы круга
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const statusLabel = document.getElementById('statusLabel');
  const btnAudio = document.getElementById('btnAudio');
  const btnNext = document.getElementById('btnNext');

  let W, H, cx, cy;
  const SEATS_COUNT = 12;
  const SEAT_RADIUS = 280;
  let activeSeat = 0;
  let phase = 2; // 1: silence, 2: feelings, 3: desires, 4: completion

  // Simplex-like noise helper
  function pseudoNoise(x, y, t) {
    return Math.sin(x * 0.015 + t * 0.8) * Math.cos(y * 0.015 - t * 0.7) +
           Math.sin((x + y) * 0.02 + t * 1.2) * 0.5;
  }

  // Seats definition
  const seats = [];
  function layoutSeats() {
    seats.length = 0;
    for (let i = 0; i < SEATS_COUNT; i++) {
      const ang = (i / SEATS_COUNT) * Math.PI * 2 - Math.PI / 2;
      seats.push({
        id: i,
        angle: ang,
        x: cx + Math.cos(ang) * SEAT_RADIUS,
        y: cy + Math.sin(ang) * SEAT_RADIUS,
        pulse: 0,
        spokenCount: 0,
      });
    }
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = canvas.width = rect.width * (window.devicePixelRatio || 1);
    H = canvas.height = rect.height * (window.devicePixelRatio || 1);
    cx = W / 2;
    cy = H / 2;
    layoutSeats();
  }
  window.addEventListener('resize', resize);

  // Particles (Embers)
  const EMBER_COUNT = 120;
  const embers = [];
  function createEmber() {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 45;
    return {
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -0.6 - Math.random() * 1.4,
      size: 1.2 + Math.random() * 2.4,
      life: 0,
      maxLife: 60 + Math.random() * 120,
      alpha: 0,
      seed: Math.random() * 1000,
      hotness: Math.random()
    };
  }
  for (let i = 0; i < EMBER_COUNT; i++) {
    const e = createEmber();
    e.life = Math.random() * e.maxLife; // Stagger spawn
    embers.push(e);
  }

  // Hearth Nodes (Feelings/Desires), Smooth Silk Ribbon and Flight Sparks
  const words = [];
  const flightSparks = [];
  let desiresCount = 0;

  function addWord(text, family, kind = 'feeling', customSeat = null) {
    if (customSeat !== null && customSeat !== undefined) {
      activeSeat = customSeat;
    }
    const seat = seats[activeSeat];
    seat.pulse = 1.0;
    seat.spokenCount++;

    const isDesire = kind === 'desire';
    const isPass = kind === 'pass';
    const displayText = isDesire ? '✦ ' + text : text;
    const textWidth = displayText.length * 8.2 + 22;

    let targetX, targetY;
    if (isDesire) {
      // Disperse desire lanterns gracefully across the upper night sky via Golden Ratio
      const k = desiresCount++;
      const frac = v => v - Math.floor(v);
      targetX = cx + (frac(0.28 + k * 0.618034) - 0.5) * (W * 0.72);
      targetY = 60 + frac(0.5 + k * 0.381966) * 90;
    } else if (!isPass) {
      // Feelings settle inside the circular hearth radius with comfortable spacing
      const wordAngle = (activeSeat / SEATS_COUNT) * Math.PI * 2 - Math.PI / 2;
      const targetDist = 85 + (Math.random() - 0.5) * 45;
      targetX = cx + Math.cos(wordAngle) * targetDist;
      targetY = cy + Math.sin(wordAngle) * targetDist;
    } else {
      targetX = seat.x;
      targetY = seat.y;
    }

    const newWord = {
      text: displayText,
      kind: kind,
      family: family,
      seatId: activeSeat,
      x: seat.x,
      y: seat.y,
      vx: 0,
      vy: 0,
      targetX: targetX,
      targetY: targetY,
      width: textWidth,
      height: 24,
      born: performance.now(),
      intensity: 1.0,
      isDesire: isDesire,
      isPass: isPass
    };

    words.push(newWord);

    // Spawn smooth transient flight spark from speaker's seat
    if (!isPass) {
      flightSparks.push({
        sx: seat.x,
        sy: seat.y,
        tx: targetX,
        ty: targetY,
        born: performance.now(),
        duration: 1250
      });
    }

    // Audio chime
    if (audioOn) {
      if (kind === 'desire') playBell();
      else if (kind === 'pass') playPass();
      else playChime(activeSeat);
    }

    updateStatus();
  }

  function updateStatus() {
    const phases = ['01 · тишина', '02 · круг чувств', '03 · чего хочется', '04 · выход'];
    statusLabel.textContent = `${phases[phase - 1]} · место ${String(activeSeat + 1).padStart(2, '0')}`;
  }

  // Audio Engine: D Dorian Drone (D3 146.83 Hz)
  let audioCtx = null;
  let audioOn = false;
  let droneGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.connect(audioCtx.destination);

    // D3 Fundamental
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime);

    // D4 Harmonic
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(293.66, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(360, audioCtx.currentTime);

    const subGain = audioCtx.createGain();
    subGain.gain.value = 0.5;
    osc2.connect(subGain);
    subGain.connect(filter);
    osc1.connect(filter);
    filter.connect(droneGain);

    osc1.start();
    osc2.start();
  }

  function toggleAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    btnAudio.classList.toggle('active', audioOn);
    if (audioOn) {
      droneGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 1.5);
    } else {
      droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
  }

  function playChime(seatIdx) {
    if (!audioCtx || !audioOn) return;
    const notes = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66]; // D Dorian scale
    const freq = notes[seatIdx % notes.length] * 2;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 3.2);
  }

  function playBell() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 chime
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.8);
  }

  function playPass() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110.0, audioCtx.currentTime); // Soft low gong
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.2);
  }

  btnAudio.addEventListener('click', toggleAudio);

  // Render Loop
  let lastTime = 0;
  function render(time) {
    const t = time * 0.001;
    ctx.clearRect(0, 0, W, H);

    // 1. Dark warm background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 2. Central Hearth Glow (Breathing core ~8s rhythm)
    const breath = Math.sin(t * 0.75) * 0.18 + Math.sin(t * 1.6) * 0.06;
    const coreRadius = 110 * (1.0 + breath);

    const hearthGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 1.8);
    hearthGrad.addColorStop(0.0, 'rgba(236, 228, 214, 0.45)'); // Hot linen core
    hearthGrad.addColorStop(0.25, 'rgba(255, 178, 102, 0.28)'); // Amber glow
    hearthGrad.addColorStop(0.65, 'rgba(217, 32, 39, 0.12)');  // Carmine embers edge
    hearthGrad.addColorStop(1.0, 'rgba(5, 5, 5, 0.0)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hearthGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Subtle stone ring of the firepit
    ctx.strokeStyle = 'rgba(236, 228, 214, 0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 140, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Transient Flight Sparks from Seats
    const now = performance.now();
    for (let i = flightSparks.length - 1; i >= 0; i--) {
      const sp = flightSparks[i];
      const elapsed = now - sp.born;
      if (elapsed >= sp.duration) {
        flightSparks.splice(i, 1);
        continue;
      }
      const q = elapsed / sp.duration;
      const ease = 1 - Math.pow(1 - q, 3);
      const midX = (sp.sx + sp.tx) / 2;
      const midY = Math.min(sp.sy, sp.ty) - 45;
      const u = 1 - ease;
      const x = u * u * sp.sx + 2 * u * ease * midX + ease * ease * sp.tx;
      const y = u * u * sp.sy + 2 * u * ease * midY + ease * ease * sp.ty;

      ctx.save();
      ctx.fillStyle = `rgba(255, 178, 102, ${0.9 * (1 - q * 0.7)})`;
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x, y, 2.2 * (1 - q * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3b. Physics Tick & Anti-Collision for Feeling Words
    const feelingWords = words.filter(w => !w.isDesire && !w.isPass);
    for (let i = 0; i < feelingWords.length; i++) {
      const w = feelingWords[i];
      const k = 0.04;
      const damp = 0.88;
      w.vx = (w.vx + (w.targetX - w.x) * k) * damp;
      w.vy = (w.vy + (w.targetY - w.y) * k) * damp;
      w.x += w.vx;
      w.y += w.vy;
    }

    // AABB Damped Separation (prevents words from ever stacking or overlapping)
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < feelingWords.length; i++) {
        for (let j = i + 1; j < feelingWords.length; j++) {
          const a = feelingWords[i], b = feelingWords[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const ox = (a.width + b.width) / 2 + 14 - Math.abs(dx);
          const oy = (a.height + b.height) / 2 + 8 - Math.abs(dy);
          if (ox > 0 && oy > 0) {
            if (ox < oy) {
              const s = (dx >= 0 ? 1 : -1) * ox * 0.28;
              a.x -= s; b.x += s;
            } else {
              const s = (dy >= 0 ? 1 : -1) * oy * 0.28;
              a.y -= s; b.y += s;
            }
          }
        }
      }
    }

    // Physics for Desires
    const desireWords = words.filter(w => w.isDesire);
    for (let i = 0; i < desireWords.length; i++) {
      const d = desireWords[i];
      const damp = 0.90;
      d.vx = (d.vx + (d.targetX - d.x) * 0.035) * damp;
      d.vy = (d.vy + (d.targetY - d.y) * 0.035) * damp;
      d.x += d.vx;
      d.y += d.vy;
    }

    // 3c. Continuous Silk Ribbon (Catmull-Rom Spline with C1 Tangent Continuity)
    if (feelingWords.length >= 2) {
      for (let i = 0; i < feelingWords.length - 1; i++) {
        const p0 = i > 0 ? feelingWords[i - 1] : feelingWords[i];
        const p1 = feelingWords[i];
        const p2 = feelingWords[i + 1];
        const p3 = i < feelingWords.length - 2 ? feelingWords[i + 2] : p2;

        // Catmull-Rom control points guarantee identical incoming & outgoing tangents at each node
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        // Subtle breathing wave
        const wave = Math.sin(t * 1.5 + i * 0.9) * 3;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.bezierCurveTo(cp1x, cp1y + wave, cp2x, cp2y - wave, p2.x, p2.y);

        const recency = (i + 1) / feelingWords.length;
        if (recency > 0.65) {
          ctx.strokeStyle = `rgba(255, 178, 102, ${0.45 + recency * 0.45})`;
          ctx.lineWidth = 1.6;
          ctx.shadowColor = '#ffb266';
          ctx.shadowBlur = 9;
        } else if (recency > 0.3) {
          ctx.strokeStyle = `rgba(217, 32, 39, ${0.25 + recency * 0.35})`;
          ctx.lineWidth = 1.1;
          ctx.shadowColor = '#d92027';
          ctx.shadowBlur = 4;
        } else {
          ctx.strokeStyle = `rgba(236, 228, 214, ${0.15 + recency * 0.2})`;
          ctx.lineWidth = 0.8;
          ctx.setLineDash([4, 6]);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // 4. Embers Particle Simulation
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      if (e.life >= e.maxLife) {
        // Respawn near hearth
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 38;
        e.x = cx + Math.cos(angle) * dist;
        e.y = cy + Math.sin(angle) * dist;
        e.vx = (Math.random() - 0.5) * 0.5;
        e.vy = -0.5 - Math.random() * 1.5;
        e.life = 0;
        e.maxLife = 70 + Math.random() * 130;
      }

      const progress = e.life / e.maxLife;
      // Perlin/Simplex turbulence drift
      const noise = pseudoNoise(e.x, e.y, t);
      e.vx += noise * 0.08;
      e.vx *= 0.94; // Air drag
      e.x += e.vx;
      e.y += e.vy;

      // Alpha envelope: fade in quickly, fade out at end
      const alpha = progress < 0.2
        ? progress / 0.2
        : (1.0 - progress);

      // Color transition from hot amber to dark carmine
      const color = progress < 0.4
        ? `rgba(255, 236, 210, ${alpha * 0.85})`
        : progress < 0.75
        ? `rgba(255, 178, 102, ${alpha * 0.7})`
        : `rgba(217, 32, 39, ${alpha * 0.45})`;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size * (1 - progress * 0.4), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 5. Draw Seats Ring (12 positions around hearth)
    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      const isActive = i === activeSeat;
      if (s.pulse > 0) s.pulse -= 0.02;

      // Seat dot
      ctx.beginPath();
      ctx.arc(s.x, s.y, isActive ? 6 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = isActive ? '#ffb266' : s.spokenCount > 0 ? '#8a745d' : '#282018';
      ctx.fill();

      // Active pulsing aura
      if (isActive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 12 + Math.sin(t * 3) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Seat label
      ctx.fillStyle = isActive ? '#ffb266' : '#554738';
      ctx.font = '10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelDist = SEAT_RADIUS + 22;
      const lx = cx + Math.cos(s.angle) * labelDist;
      const ly = cy + Math.sin(s.angle) * labelDist;
      ctx.fillText(`[${String(i + 1).padStart(2, '0')}]`, lx, ly);
    }

    // 6. Draw Words & Desires
    for (let i = 0; i < words.length; i++) {
      const w = words[i];

      ctx.save();
      ctx.translate(w.x, w.y);

      if (w.isDesire) {
        const halfW = w.width / 2;
        ctx.fillStyle = 'rgba(10, 8, 5, 0.88)';
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(-halfW, -11, w.width, 22, 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = "12px 'JetBrains Mono'";
        ctx.fillStyle = '#ffb266';
        ctx.shadowColor = '#ffb266';
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(w.text, 0, 0);
      } else if (w.isPass) {
        ctx.fillStyle = '#44362a';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Feeling Word Box with clean margins
        const halfW = w.width / 2;
        ctx.fillStyle = '#080706';
        ctx.fillRect(-halfW, -11, w.width, 22);

        ctx.strokeStyle = 'rgba(255, 178, 102, 0.28)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-halfW, -11, w.width, 22);

        ctx.font = "12px 'JetBrains Mono'";
        ctx.fillStyle = '#ece4d6';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(w.text, 0, 0);
      }
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // Realistic Organic Circle Journey
  // Not everyone speaks, some pass, some speak multiple times, some stay silent holding space
  const REALISTIC_CIRCLE_JOURNEY = [
    { seat: 0, text: 'замедление', family: 'спокойствие', pause: 4500, p: 2 },
    { seat: 5, text: 'волнение в груди', family: 'тревога', pause: 6000, p: 2 },
    { seat: 9, text: 'ком в горле', family: 'тело', pause: 5500, p: 2 },
    { seat: 2, text: 'пас', kind: 'pass', pause: 3000, p: 2 },
    { seat: 7, text: 'тепло от ваших слов', family: 'нежность', pause: 6500, p: 2 },
    { seat: 5, text: 'отпускает напряжение', family: 'спокойствие', pause: 5000, p: 2 }, // Seat 5 speaks again!
    { seat: 11, text: 'пас', kind: 'pass', pause: 3000, p: 2 },
    { seat: 3, text: 'сильная усталость', family: 'усталость', pause: 6000, p: 2 },
    { seat: 8, text: 'растерянность', family: 'растерянность', pause: 7000, p: 2 },
    { seat: 0, text: 'благодарность за честность', family: 'нежность', pause: 5000, p: 2 }, // Host reflects
    // Phase 3: Desires
    { seat: 9, text: 'тишины и выдоха', kind: 'desire', pause: 5500, p: 3 },
    { seat: 3, text: 'побыть с собой', kind: 'desire', pause: 6000, p: 3 },
    { seat: 7, text: 'просто помолчать рядом', kind: 'desire', pause: 5500, p: 3 },
    { seat: 5, text: 'тепла в теле', kind: 'desire', pause: 5000, p: 3 }
    // Seats 1, 4, 6, 10 never speak. They hold the silence of the circle.
  ];
  let journeyIdx = 0;
  let autoTimer = null;
  const btnAutoDemo = document.getElementById('btnAutoDemo');

  function triggerNextTurn() {
    const step = REALISTIC_CIRCLE_JOURNEY[journeyIdx % REALISTIC_CIRCLE_JOURNEY.length];
    journeyIdx++;
    if (step.p && step.p !== phase) {
      setPhase(step.p);
    }
    addWord(step.text, step.family, step.kind || 'feeling', step.seat);
  }

  function toggleAutoDemo() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
      btnAutoDemo.innerHTML = '<span>▶</span> авто-круг';
    } else {
      btnAutoDemo.classList.add('active');
      btnAutoDemo.innerHTML = '<span>⏹</span> остановить';
      if (!audioOn) toggleAudio();
      const runStep = () => {
        triggerNextTurn();
        const currentStep = REALISTIC_CIRCLE_JOURNEY[(journeyIdx - 1) % REALISTIC_CIRCLE_JOURNEY.length];
        const nextDelay = currentStep.pause || 5000;
        autoTimer = setTimeout(runStep, nextDelay);
      };
      runStep();
    }
  }

  btnNext.addEventListener('click', triggerNextTurn);
  btnAutoDemo.addEventListener('click', toggleAutoDemo);

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      triggerNextTurn();
    } else if (e.key === 'm' || e.key === 'ь') {
      toggleAudio();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      setPhase(parseInt(e.key, 10));
    }
  });

  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setPhase(parseInt(btn.dataset.phase, 10));
    });
  });

  function setPhase(p) {
    phase = p;
    document.querySelectorAll('.phase-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.phase, 10) === phase);
    });
    updateStatus();
  }

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      addWord(chip.dataset.text, chip.dataset.family, chip.dataset.kind || 'feeling');
    });
  });

  // Seat click selection
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);

    seats.forEach(s => {
      const d = Math.hypot(mx - s.x, my - s.y);
      if (d < 25) {
        activeSeat = s.id;
        updateStatus();
      }
    });
  });

  // Init
  resize();
  updateStatus();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
