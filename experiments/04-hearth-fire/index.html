<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Салон присутствия — 04: Созерцательный костёр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      color: #ece4d6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 178, 102, 0.12);
      border: 1px solid rgba(255, 178, 102, 0.35);
      color: #ffb266;
      border-radius: 2px;
      font-weight: 700;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #ffb266;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb266;
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.4;
      background: #050505;
      border: 1px solid #181410;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: default; }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
    }
    button {
      background: #14100c;
      border: 1px solid #2a2016;
      color: #ece4d6;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #221810; border-color: #ffb266; color: #fff; }
    button.active { background: #ffb266; border-color: #ffb266; color: #050505; font-weight: 700; }
    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .chip {
      background: #100d0a;
      border: 1px solid #241c14;
      color: #8a7e70;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: #ffb266; color: #ffb266; }
    .info-bar {
      font-size: 10.5px;
      color: #706354;
      line-height: 1.6;
      padding: 0 4px;
    }
    .info-bar kbd {
      background: #15110d;
      border: 1px solid #2b2117;
      padding: 1px 4px;
      border-radius: 2px;
      color: #ece4d6;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge"><span class="dot"></span> эксперимент 04</span>
      <span style="font-weight: 600; color:#ece4d6;">созерцательный костёр присутствия</span>
      <span style="color:#605345;">· живое пламя и нити тепла</span>
    </div>
    <div id="statusLabel" style="color:#ffb266;">02 · круг чувств · место 01</div>
  </div>

  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls">
    <button id="btnNext" class="active">
      <span>space</span> реплика круга
    </button>
    <button id="btnAutoDemo">
      <span>▶</span> медитативный авто-круг
    </button>
    <button id="btnAudio">
      <span>m</span> звук d dorian
    </button>
    <div style="display:flex; gap:4px; margin-left: 8px;">
      <button class="phase-btn" data-phase="1">1 тишина</button>
      <button class="phase-btn active" data-phase="2">2 чувства</button>
      <button class="phase-btn" data-phase="3">3 желания</button>
      <button class="phase-btn" data-phase="4">4 выход</button>
    </div>
    <div class="phrase-chips">
      <span style="font-size:10px; color:#584b3d; margin-right:4px;">подбросить в круг:</span>
      <button class="chip" data-text="тревога" data-family="тревога">тревожно</button>
      <button class="chip" data-text="замедление" data-family="спокойствие">замедление</button>
      <button class="chip" data-text="тепло" data-family="нежность">тепло</button>
      <button class="chip" data-text="усталость" data-family="усталость">устал</button>
      <button class="chip" data-text="тишины" data-kind="desire">✦ тишины</button>
      <button class="chip" data-text="пас" data-kind="pass">пас</button>
    </div>
  </div>

  <div class="info-bar">
    <kbd>space</kbd> — сказать реплику и протянуть нить · <kbd>клик по стулу</kbd> — сесть на место · <kbd>m</kbd> — звук дрона · <kbd>1..4</kbd> — фазы круга
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const statusLabel = document.getElementById('statusLabel');
  const btnAudio = document.getElementById('btnAudio');
  const btnNext = document.getElementById('btnNext');
  const btnAutoDemo = document.getElementById('btnAutoDemo');

  const TAU = Math.PI * 2;
  const SEATS_COUNT = 12;

  let W, H, cx, floorCY, floorRx, floorRy, skyTop, skyH;
  let activeSeat = 0;
  let phase = 2; // 1: silence, 2: feelings, 3: desires, 4: completion

  // True Isometric Geometry
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.round(rect.width * dpr);
    H = canvas.height = Math.round(rect.height * dpr);

    cx = W / 2;
    floorCY = H * 0.65;
    floorRx = Math.min(W * 0.41, 490 * dpr);
    floorRy = Math.min(H * 0.20, 140 * dpr);

    skyTop = 40 * dpr;
    skyH = H * 0.28;

    layoutSeats();
  }

  const seats = [];
  function layoutSeats() {
    seats.length = 0;
    for (let i = 0; i < SEATS_COUNT; i++) {
      const ang = (i / SEATS_COUNT) * TAU + Math.PI / 2;
      const x = cx + Math.cos(ang) * floorRx;
      const y = floorCY + Math.sin(ang) * floorRy;
      const depth = (Math.sin(ang) + 1) / 2; // 0 (far) .. 1 (near)

      seats.push({
        id: i,
        angle: ang,
        x,
        y,
        depth,
        pulse: 0,
        spokenCount: 0,
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // =========================================================================
  // REALISTIC CAMPFIRE SIMULATION: Flame Tongues, Burning Logs & Sparks
  // =========================================================================

  // Burning Charred Logs (resting on ash bed)
  const logs = [
    { a: -0.65, len: 75, w: 9 },
    { a: 0.95, len: 70, w: 8 },
    { a: 2.35, len: 78, w: 9 },
    { a: 3.85, len: 72, w: 8 }
  ];

  // Upward buoyant flame particles
  const FLAME_COUNT = 45;
  const flameParticles = [];
  function createFlameParticle() {
    const spreadX = (Math.random() - 0.5) * 36;
    const spreadY = (Math.random() - 0.5) * 12;
    return {
      x: cx + spreadX,
      y: floorCY + spreadY,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -1.2 - Math.random() * 2.2,
      size: 14 + Math.random() * 16,
      life: 0,
      maxLife: 28 + Math.random() * 32,
      swaySeed: Math.random() * 10,
    };
  }
  for (let i = 0; i < FLAME_COUNT; i++) {
    const p = createFlameParticle();
    p.life = Math.random() * p.maxLife;
    flameParticles.push(p);
  }

  // Micro-embers caught in the thermal chimney
  const EMBER_COUNT = 70;
  const embers = [];
  function createEmber() {
    const ang = Math.random() * TAU;
    const radX = Math.random() * 30;
    const radY = Math.random() * 10;
    return {
      x: cx + Math.cos(ang) * radX,
      y: floorCY + Math.sin(ang) * radY,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.8 - Math.random() * 1.8,
      size: 1.0 + Math.random() * 2.0,
      life: Math.random() * 140,
      maxLife: 90 + Math.random() * 120,
      sway: Math.random() * TAU,
    };
  }
  for (let i = 0; i < EMBER_COUNT; i++) {
    embers.push(createEmber());
  }

  // =========================================================================
  // NODES, PROGRESSIVE THREADS & SPARKS
  // =========================================================================

  const feelings = []; // Settled beside seats
  const desires = [];  // Floating lanterns
  const sparks = [];   // Transient sparks: seat -> word (1.2s)
  const segments = []; // Animated growing spline segments between feelings
  let lastSpokenNode = null;

  function addWord(text, family, kind = 'feeling', customSeat = null) {
    if (customSeat !== null && customSeat !== undefined) {
      activeSeat = customSeat;
    }
    const seat = seats[activeSeat];
    seat.pulse = 1.0;
    seat.spokenCount++;

    const now = performance.now();

    if (kind === 'pass') {
      seat.hasPassed = true;
      if (audioOn) playPass();
      // Advance to next seat automatically
      activeSeat = (activeSeat + 1) % SEATS_COUNT;
      updateStatus();
      return;
    }

    if (kind === 'desire') {
      const k = desires.length;
      const frac = v => v - Math.floor(v);
      const targetX = cx + (frac(0.24 + k * 0.618034) - 0.5) * (floorRx * 2.1);
      const targetY = skyTop + frac(0.40 + k * 0.381966) * skyH;

      const lo = {
        text: '✦ ' + text,
        seatId: activeSeat,
        x: seat.x,
        y: seat.y - 15,
        targetX,
        targetY,
        vx: 0,
        vy: -1.0,
        settled: false,
        born: now,
      };
      desires.push(lo);

      sparks.push({
        sx: seat.x, sy: seat.y,
        tx: targetX, ty: targetY,
        born: now, duration: 1300
      });

      if (audioOn) playBell();
      activeSeat = (activeSeat + 1) % SEATS_COUNT;
      updateStatus();
      return;
    }

    // Feeling: settles comfortably on the outer clearing perimeter BESIDE the speaker's seat
    let existing = feelings.find(f => f.lemma === text && f.seatId === activeSeat);
    if (existing) {
      existing.count++;
      existing.lastAt = now;
      existing.pulse = 1.0;
      lastSpokenNode = existing;
      if (audioOn) playChime(activeSeat);
      activeSeat = (activeSeat + 1) % SEATS_COUNT;
      updateStatus();
      return;
    }

    // Positioned beside the speaker's chair facing the fire
    const outAngle = seat.angle;
    const outDist = 34 + (seat.spokenCount % 2) * 16;
    const targetX = seat.x + Math.cos(outAngle) * outDist;
    const targetY = seat.y + Math.sin(outAngle) * (outDist * 0.65) - 6;

    const newFeeling = {
      lemma: text,
      family: family || 'спокойствие',
      seatId: activeSeat,
      x: seat.x,
      y: seat.y,
      targetX,
      targetY,
      born: now,
      lastAt: now,
      pulse: 1.0,
      count: 1,
      settled: false,
    };

    // Progressive connecting thread from previous feeling node
    if (feelings.length > 0) {
      const prev = feelings[feelings.length - 1];
      segments.push({
        source: prev,
        target: newFeeling,
        born: now,
        duration: 1200, // 1.2s smooth progressive growth
      });
    }

    feelings.push(newFeeling);

    sparks.push({
      sx: seat.x, sy: seat.y,
      tx: targetX, ty: targetY,
      born: now, duration: 1250
    });

    lastSpokenNode = newFeeling;

    if (audioOn) playChime(activeSeat);
    activeSeat = (activeSeat + 1) % SEATS_COUNT;
    updateStatus();
  }

  function updateStatus() {
    const phases = ['01 · тишина', '02 · круг чувств', '03 · чего хочется', '04 · выход'];
    statusLabel.textContent = `${phases[phase - 1]} · место ${String(activeSeat + 1).padStart(2, '0')}`;
  }

  // Audio Engine: Procedural D Dorian Drone
  let audioCtx = null;
  let audioOn = false;
  let droneGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.connect(audioCtx.destination);

    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime);

    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(293.66, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(340, audioCtx.currentTime);

    const subGain = audioCtx.createGain();
    subGain.gain.value = 0.4;
    osc2.connect(subGain);
    subGain.connect(filter);
    osc1.connect(filter);
    filter.connect(droneGain);

    osc1.start();
    osc2.start();
  }

  function toggleAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    btnAudio.classList.toggle('active', audioOn);
    if (audioOn) {
      droneGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 1.5);
    } else {
      droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
  }

  function playChime(seatIdx) {
    if (!audioCtx || !audioOn) return;
    const notes = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66];
    const freq = notes[seatIdx % notes.length] * 2;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 3.4);
  }

  function playBell() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.8);
  }

  function playPass() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110.0, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.2);
  }

  btnAudio.addEventListener('click', toggleAudio);

  // =========================================================================
  // MAIN RENDER LOOP
  // =========================================================================

  function render(time) {
    const t = time * 0.001;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // 1. Dark warm background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 2. Isometric Clearing Rings on Ground
    ctx.save();
    for (let k = 1; k <= 3; k++) {
      const rx = floorRx * (0.35 + k * 0.22);
      const ry = floorRy * (0.35 + k * 0.22);
      ctx.strokeStyle = k === 2 ? 'rgba(255, 178, 102, 0.06)' : 'rgba(236, 228, 214, 0.025)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, floorCY, rx, ry, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // 3. Central Fire Ground Illumination (flickering warm pool)
    const flicker = Math.sin(t * 12) * 0.02 + Math.sin(t * 7.5) * 0.03 + Math.sin(t * 1.8) * 0.06;
    const poolRadiusX = (150 + flicker * 40);
    const poolRadiusY = (55 + flicker * 15);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const poolGrad = ctx.createRadialGradient(cx, floorCY, 0, cx, floorCY, poolRadiusX);
    poolGrad.addColorStop(0.0, 'rgba(255, 236, 200, 0.35)');
    poolGrad.addColorStop(0.35, 'rgba(255, 178, 102, 0.22)');
    poolGrad.addColorStop(0.70, 'rgba(180, 50, 15, 0.08)');
    poolGrad.addColorStop(1.0, 'rgba(5, 5, 5, 0.0)');
    ctx.fillStyle = poolGrad;
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, poolRadiusX * 1.5, poolRadiusY * 1.5, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 4. Campfire Fuel: Charred Burning Logs in Isometric Perspective
    ctx.save();
    // Ash bed under logs
    ctx.fillStyle = '#110d0a';
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, 65, 22, 0, 0, TAU);
    ctx.fill();

    // Logs
    for (let i = 0; i < logs.length; i++) {
      const lg = logs[i];
      const x1 = cx + Math.cos(lg.a) * (lg.len * 0.5);
      const y1 = floorCY + Math.sin(lg.a) * (lg.len * 0.18);
      const x2 = cx - Math.cos(lg.a) * (lg.len * 0.5);
      const y2 = floorCY - Math.sin(lg.a) * (lg.len * 0.18);

      ctx.strokeStyle = '#1e1610';
      ctx.lineWidth = lg.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Glowing ember crack in the center of log
      const emberHeat = Math.sin(t * 2 + i * 1.5) * 0.2 + 0.7;
      ctx.strokeStyle = `rgba(255, 150, 50, ${emberHeat * 0.8})`;
      ctx.lineWidth = lg.w * 0.35;
      ctx.beginPath();
      ctx.moveTo(cx + (x1 - cx) * 0.3, floorCY + (y1 - floorCY) * 0.3);
      ctx.lineTo(cx + (x2 - cx) * 0.3, floorCY + (y2 - floorCY) * 0.3);
      ctx.stroke();
    }
    ctx.restore();

    // 5. Living Organic Flame Tongues (Additive buoyant particles)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flameParticles.length; i++) {
      const p = flameParticles[i];
      p.life++;
      if (p.life >= p.maxLife) {
        Object.assign(p, createFlameParticle());
      }
      const progress = p.life / p.maxLife; // 0..1
      const sway = Math.sin(t * 6 + p.swaySeed + p.y * 0.05) * 0.7;
      p.vx = (p.vx + sway * 0.1) * 0.94;
      p.x += p.vx;
      p.y += p.vy;

      // Shrink size as flame rises to a pointed tip
      const curSize = Math.max(1, p.size * (1 - progress * 0.75));
      const alpha = progress < 0.2 ? progress / 0.2 : (1 - progress);

      // Blackbody color ramp: white-hot -> rich amber -> deep flame red
      const color = progress < 0.28
        ? `rgba(255, 250, 235, ${alpha * 0.75})`
        : progress < 0.65
        ? `rgba(255, 178, 80, ${alpha * 0.65})`
        : `rgba(217, 45, 15, ${alpha * 0.40})`;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, curSize, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 6. Micro-embers and Smoke rising into the night sky
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      if (e.life >= e.maxLife) {
        Object.assign(e, createEmber());
      }
      const p = e.life / e.maxLife;
      const swirl = Math.sin(t * 2.2 + e.sway) * 0.5;
      e.vx = (e.vx + swirl * 0.05) * 0.96;
      e.x += e.vx;
      e.y += e.vy;

      const alpha = p < 0.25 ? p / 0.25 : (1.0 - p);
      const col = p < 0.4
        ? `rgba(255, 240, 210, ${alpha * 0.85})`
        : p < 0.75
        ? `rgba(255, 178, 102, ${alpha * 0.70})`
        : `rgba(180, 40, 15, ${alpha * 0.40})`;

      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size * (1 - p * 0.35), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 7. Transient Flight Sparks from Seats
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      const elapsed = now - sp.born;
      if (elapsed >= sp.duration) {
        sparks.splice(i, 1);
        continue;
      }
      const q = elapsed / sp.duration;
      const ease = 1 - Math.pow(1 - q, 3);
      const midX = (sp.sx + sp.tx) / 2;
      const midY = Math.min(sp.sy, sp.ty) - 40;
      const u = 1 - ease;
      const x = u * u * sp.sx + 2 * u * ease * midX + ease * ease * sp.tx;
      const y = u * u * sp.sy + 2 * u * ease * midY + ease * ease * sp.ty;

      ctx.save();
      ctx.fillStyle = `rgba(255, 178, 102, ${0.9 * (1 - q * 0.7)})`;
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x, y, 2.4 * (1 - q * 0.5), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // 8. Progressive Translucent Amber Threads Between Feelings (Unified Fire Color)
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      const src = seg.source;
      const tgt = seg.target;

      const elapsed = now - seg.born;
      const growth = Math.min(1.0, elapsed / seg.duration); // Smooth growth 0..1

      // Interpolate current head of the growing thread
      const curTgtX = src.x + (tgt.x - src.x) * growth;
      const curTgtY = src.y + (tgt.y - src.y) * growth;

      // Arc bent gracefully around the clearing
      const midX = (src.x + curTgtX) / 2;
      const midY = (src.y + curTgtY) / 2 - 20;
      const wave = Math.sin(t * 1.5 + i * 0.8) * 3;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(src.x, src.y);
      ctx.quadraticCurveTo(midX, midY + wave, curTgtX, curTgtY);

      // Single unified warm translucent firelight tone
      const alpha = 0.22 + 0.18 * (i / segments.length);
      ctx.strokeStyle = `rgba(255, 185, 115, ${alpha})`;
      ctx.lineWidth = 1.2;
      ctx.shadowColor = 'rgba(255, 178, 102, 0.4)';
      ctx.shadowBlur = 6;
      ctx.stroke();
      ctx.restore();
    }

    // 9. Draw Seats Ring
    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      const isActive = i === activeSeat;
      if (s.pulse > 0) s.pulse -= 0.02;

      const baseR = 3.2 + s.depth * 2.2;

      ctx.beginPath();
      ctx.arc(s.x, s.y, isActive ? baseR + 2 : baseR, 0, TAU);
      ctx.fillStyle = isActive ? '#ffb266' : s.spokenCount > 0 ? '#997c5e' : '#241c14';
      ctx.fill();

      if (isActive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, baseR + 8 + Math.sin(t * 3) * 1.5, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (s.hasPassed) {
        ctx.fillStyle = '#3a2e22';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 12, 3, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = isActive ? '#ffb266' : '#524335';
      ctx.font = '10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelDist = 20 + s.depth * 8;
      const lx = s.x + Math.cos(s.angle) * labelDist;
      const ly = s.y + Math.sin(s.angle) * (labelDist * 0.6);
      ctx.fillText(`[${String(i + 1).padStart(2, '0')}]`, lx, ly);
    }

    // 10. Update & Render Settled Feelings (BESIDE SEATS, CALM)
    for (let i = 0; i < feelings.length; i++) {
      const f = feelings[i];
      if (!f.settled) {
        f.x += (f.targetX - f.x) * 0.07;
        f.y += (f.targetY - f.y) * 0.07;
        if (Math.hypot(f.targetX - f.x, f.targetY - f.y) < 1.2) {
          f.settled = true;
        }
      } else {
        f.y = f.targetY + Math.sin(t * 0.8 + i) * 1.0;
      }

      ctx.save();
      ctx.translate(f.x, f.y);

      const label = f.count > 1 ? `${f.lemma} ×${f.count}` : f.lemma;
      ctx.font = "11.5px 'JetBrains Mono'";
      const textMetrics = ctx.measureText(label);
      const bgW = textMetrics.width + 16;
      const halfW = bgW / 2;

      ctx.fillStyle = 'rgba(9, 7, 5, 0.92)';
      ctx.strokeStyle = f === lastSpokenNode ? 'rgba(255, 178, 102, 0.55)' : 'rgba(236, 228, 214, 0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-halfW, -11, bgW, 22, 2);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = f === lastSpokenNode ? '#ffb266' : '#ece4d6';
      if (f === lastSpokenNode) {
        ctx.shadowColor = '#ffb266';
        ctx.shadowBlur = 8;
      }
      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    // 11. Update & Render Desires (LANTERNS IN THE NIGHT SKY)
    for (let i = 0; i < desires.length; i++) {
      const d = desires[i];
      if (!d.settled) {
        d.x += (d.targetX - d.x) * 0.04;
        d.y += (d.targetY - d.y) * 0.04;
        if (Math.hypot(d.targetX - d.x, d.targetY - d.y) < 3) {
          d.settled = true;
        }
      } else {
        d.x = d.targetX + Math.sin(t * 0.5 + i * 1.3) * 3;
        d.y = d.targetY + Math.cos(t * 0.4 + i * 1.1) * 2;
      }

      ctx.save();
      ctx.translate(d.x, d.y);

      ctx.font = "11.5px 'JetBrains Mono'";
      const metrics = ctx.measureText(d.text);
      const bgW = metrics.width + 16;
      const halfW = bgW / 2;

      ctx.fillStyle = 'rgba(14, 10, 6, 0.90)';
      ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-halfW, -11, bgW, 22, 2);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffb266';
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 10;
      ctx.fillText(d.text, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // =========================================================================
  // CONTINUOUS EXPANSION & MEDITATIVE DEMO
  // =========================================================================

  const CIRCLE_VOICES = [
    { text: 'замедление', family: 'спокойствие' },
    { text: 'волнение в груди', family: 'тревога' },
    { text: 'ком в горле', family: 'тело' },
    { text: 'пас', kind: 'pass' },
    { text: 'тепло от ваших слов', family: 'нежность' },
    { text: 'сильная усталость', family: 'усталость' },
    { text: 'растерянность', family: 'растерянность' },
    { text: 'благодарность за честность', family: 'нежность' },
    { text: 'тишины и выдоха', kind: 'desire' },
    { text: 'побыть с собой', kind: 'desire' },
    { text: 'просто помолчать рядом', kind: 'desire' },
    { text: 'тепла в теле', kind: 'desire' },
    { text: 'отпускает напряжение', family: 'спокойствие' },
    { text: 'живость', family: 'радость' },
    { text: 'глубокий вдох', family: 'тело' },
    { text: 'ясность', family: 'спокойствие' }
  ];

  let voiceIdx = 0;
  let autoTimer = null;

  function triggerNextTurn() {
    const item = CIRCLE_VOICES[voiceIdx % CIRCLE_VOICES.length];
    voiceIdx++;

    // Switch phases naturally as circle progresses
    if (voiceIdx > 8 && voiceIdx <= 12 && phase !== 3) {
      setPhase(3);
    } else if (voiceIdx > 12 && phase !== 4) {
      setPhase(4);
    }

    addWord(item.text, item.family, item.kind || 'feeling', activeSeat);
  }

  function toggleAutoDemo() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
    } else {
      btnAutoDemo.classList.add('active');
      const step = () => {
        triggerNextTurn();
        autoTimer = setTimeout(step, 5500);
      };
      step();
    }
  }

  function setPhase(p) {
    phase = p;
    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.phase, 10) === phase);
    });
    updateStatus();
  }

  // Interactivity
  btnNext.addEventListener('click', triggerNextTurn);
  btnAutoDemo.addEventListener('click', toggleAutoDemo);

  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.addEventListener('click', () => setPhase(parseInt(btn.dataset.phase, 10)));
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      addWord(chip.dataset.text, chip.dataset.family, chip.dataset.kind || 'feeling');
    });
  });

  // Click seat to set active focus
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      if (Math.hypot(clickX - s.x, clickY - s.y) < 28) {
        activeSeat = i;
        s.pulse = 1.0;
        updateStatus();
        break;
      }
    }
  });

  // Keyboard Hotkeys
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      triggerNextTurn();
    } else if (e.key === 'm' || e.key === 'ь') {
      toggleAudio();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      setPhase(parseInt(e.key, 10));
    }
  });

  requestAnimationFrame(render);
})();
</script>

</body>
