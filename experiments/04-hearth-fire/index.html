<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Салон присутствия — 04: Цифровой созерцательный костёр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      color: #ece4d6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 178, 102, 0.12);
      border: 1px solid rgba(255, 178, 102, 0.35);
      color: #ffb266;
      border-radius: 2px;
      font-weight: 700;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #ffb266;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb266;
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.4;
      background: #050505;
      border: 1px solid #181410;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: default; }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
    }
    button {
      background: #14100c;
      border: 1px solid #2a2016;
      color: #ece4d6;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #221810; border-color: #ffb266; color: #fff; }
    button.active { background: #ffb266; border-color: #ffb266; color: #050505; font-weight: 700; }
    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .chip {
      background: #100d0a;
      border: 1px solid #241c14;
      color: #8a7e70;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: #ffb266; color: #ffb266; }
    .info-bar {
      font-size: 10.5px;
      color: #706354;
      line-height: 1.6;
      padding: 0 4px;
    }
    .info-bar kbd {
      background: #15110d;
      border: 1px solid #2b2117;
      padding: 1px 4px;
      border-radius: 2px;
      color: #ece4d6;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge"><span class="dot"></span> эксперимент 04</span>
      <span style="font-weight: 600; color:#ece4d6;">созерцательный костёр присутствия</span>
      <span style="color:#605345;">· изометрическая поляна</span>
    </div>
    <div id="statusLabel" style="color:#ffb266;">02 · круг чувств · тишина у огня</div>
  </div>

  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls">
    <button id="btnNext" class="active">
      <span>space</span> реплика круга
    </button>
    <button id="btnAutoDemo">
      <span>▶</span> медитативный авто-круг
    </button>
    <button id="btnAudio">
      <span>m</span> звук d dorian
    </button>
    <div style="display:flex; gap:4px; margin-left: 8px;">
      <button class="phase-btn" data-phase="1">1 тишина</button>
      <button class="phase-btn active" data-phase="2">2 чувства</button>
      <button class="phase-btn" data-phase="3">3 желания</button>
      <button class="phase-btn" data-phase="4">4 выход</button>
    </div>
    <div class="phrase-chips">
      <span style="font-size:10px; color:#584b3d; margin-right:4px;">подбросить в круг:</span>
      <button class="chip" data-text="тревога" data-family="тревога">тревожно</button>
      <button class="chip" data-text="замедление" data-family="спокойствие">замедление</button>
      <button class="chip" data-text="тепло" data-family="нежность">тепло</button>
      <button class="chip" data-text="усталость" data-family="усталость">устал</button>
      <button class="chip" data-text="тишины" data-kind="desire">✦ тишины</button>
      <button class="chip" data-text="пас" data-kind="pass">пас</button>
    </div>
  </div>

  <div class="info-bar">
    <kbd>space</kbd> — сказать реплику · <kbd>клик по стулу</kbd> — сесть на место · <kbd>m</kbd> — звук дрона · <kbd>1..4</kbd> — фазы круга
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const statusLabel = document.getElementById('statusLabel');
  const btnAudio = document.getElementById('btnAudio');
  const btnNext = document.getElementById('btnNext');
  const btnAutoDemo = document.getElementById('btnAutoDemo');

  const TAU = Math.PI * 2;
  const SEATS_COUNT = 12;

  let W, H, cx, floorCY, floorRx, floorRy, skyTop, skyH;
  let activeSeat = 0;
  let phase = 2; // 1: silence, 2: feelings, 3: desires, 4: completion

  // Resize with True Isometric Clearing Geometry
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.round(rect.width * dpr);
    H = canvas.height = Math.round(rect.height * dpr);

    cx = W / 2;
    // Clearing floor is placed in lower 65% of screen, leaving upper 35% for the night sky
    floorCY = H * 0.63;
    floorRx = Math.min(W * 0.40, 480 * dpr);
    floorRy = Math.min(H * 0.20, 140 * dpr);

    skyTop = 40 * dpr;
    skyH = H * 0.28;

    layoutSeats();
  }

  // Seats placed on the Isometric Clearing Ellipse
  const seats = [];
  function layoutSeats() {
    seats.length = 0;
    for (let i = 0; i < SEATS_COUNT; i++) {
      // Index 0 is bottom center (closest), index 6 is top center (farthest)
      const ang = (i / SEATS_COUNT) * TAU + Math.PI / 2;
      const x = cx + Math.cos(ang) * floorRx;
      const y = floorCY + Math.sin(ang) * floorRy;
      const depth = (Math.sin(ang) + 1) / 2; // 0 (far) .. 1 (near)

      seats.push({
        id: i,
        angle: ang,
        x,
        y,
        depth,
        pulse: 0,
        spokenCount: 0,
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // Embers and Swirling Smoke rising from the hearth into the night sky
  const EMBER_COUNT = 85;
  const embers = [];
  function createEmber() {
    const ang = Math.random() * TAU;
    const radX = Math.random() * 45;
    const radY = Math.random() * 16;
    return {
      x: cx + Math.cos(ang) * radX,
      y: floorCY + Math.sin(ang) * radY,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -0.6 - Math.random() * 1.6,
      size: 1.1 + Math.random() * 2.2,
      life: Math.random() * 160,
      maxLife: 100 + Math.random() * 140,
      spiralOffset: Math.random() * TAU,
    };
  }
  for (let i = 0; i < EMBER_COUNT; i++) {
    embers.push(createEmber());
  }

  // Feelings settled around the clearing, Desires floating in the sky
  const feelings = []; // Settled feelings beside seats
  const desires = [];  // Paper lanterns in the night sky
  const sparks = [];   // Transient sparks: seat -> word (1.2s)
  let lastSpokenNode = null;

  function addWord(text, family, kind = 'feeling', customSeat = null) {
    if (customSeat !== null && customSeat !== undefined) {
      activeSeat = customSeat;
    }
    const seat = seats[activeSeat];
    seat.pulse = 1.0;
    seat.spokenCount++;

    const now = performance.now();

    if (kind === 'pass') {
      // Pass is marked as a silent ember at the seat
      seat.hasPassed = true;
      if (audioOn) playPass();
      updateStatus();
      return;
    }

    if (kind === 'desire') {
      // Desire: released as a glowing lantern into the upper sky via Golden Ratio
      const k = desires.length;
      const frac = v => v - Math.floor(v);
      const targetX = cx + (frac(0.24 + k * 0.618034) - 0.5) * (floorRx * 2.1);
      const targetY = skyTop + frac(0.42 + k * 0.381966) * skyH;
      const displayText = '✦ ' + text;

      const lo = {
        text: displayText,
        seatId: activeSeat,
        x: seat.x,
        y: seat.y - 15,
        targetX,
        targetY,
        vx: 0,
        vy: -1.2,
        settled: false,
        born: now,
        pulse: 1.0,
      };
      desires.push(lo);

      // Spark rising from seat to sky
      sparks.push({
        sx: seat.x, sy: seat.y,
        tx: targetX, ty: targetY,
        born: now, duration: 1400,
        color: '#ffb266'
      });

      if (audioOn) playBell();
      updateStatus();
      return;
    }

    // Feeling: settles comfortably on the outer clearing perimeter BESIDE the speaker's seat
    // Check if lemma already exists to avoid clutter
    let existing = feelings.find(f => f.lemma === text && f.seatId === activeSeat);
    if (existing) {
      existing.count++;
      existing.lastAt = now;
      existing.pulse = 1.0;
      lastSpokenNode = existing;
      if (audioOn) playChime(activeSeat);
      updateStatus();
      return;
    }

    // Offset outward from the seat into the forest fringe
    const outAngle = seat.angle;
    const outDist = 34 + (seat.spokenCount % 2) * 18;
    const targetX = seat.x + Math.cos(outAngle) * outDist;
    const targetY = seat.y + Math.sin(outAngle) * (outDist * 0.65) - 8;

    const newFeeling = {
      lemma: text,
      family: family || 'спокойствие',
      seatId: activeSeat,
      x: seat.x,
      y: seat.y,
      targetX,
      targetY,
      vx: 0,
      vy: 0,
      born: now,
      lastAt: now,
      pulse: 1.0,
      count: 1,
      settled: false,
    };

    feelings.push(newFeeling);

    // Warm flight spark from seat into the hearth, then settling beside
    sparks.push({
      sx: seat.x, sy: seat.y,
      tx: targetX, ty: targetY,
      born: now, duration: 1300,
      color: '#ffb266'
    });

    lastSpokenNode = newFeeling;

    if (audioOn) playChime(activeSeat);
    updateStatus();
  }

  function updateStatus() {
    const phases = ['01 · тишина', '02 · круг чувств', '03 · чего хочется', '04 · выход'];
    statusLabel.textContent = `${phases[phase - 1]} · место ${String(activeSeat + 1).padStart(2, '0')}`;
  }

  // Audio Engine: Procedural D Dorian Drone (D3 146.83 Hz)
  let audioCtx = null;
  let audioOn = false;
  let droneGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.connect(audioCtx.destination);

    // D3 Root Drone
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime);

    // D4 Soft Harmonic
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(293.66, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(340, audioCtx.currentTime);

    const subGain = audioCtx.createGain();
    subGain.gain.value = 0.4;
    osc2.connect(subGain);
    subGain.connect(filter);
    osc1.connect(filter);
    filter.connect(droneGain);

    osc1.start();
    osc2.start();
  }

  function toggleAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    btnAudio.classList.toggle('active', audioOn);
    if (audioOn) {
      droneGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 1.5);
    } else {
      droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
  }

  function playChime(seatIdx) {
    if (!audioCtx || !audioOn) return;
    const notes = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66];
    const freq = notes[seatIdx % notes.length] * 2;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 3.4);
  }

  function playBell() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.8);
  }

  function playPass() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110.0, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.2);
  }

  btnAudio.addEventListener('click', toggleAudio);

  // Render Loop
  function render(time) {
    const t = time * 0.001;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // 1. Deep Midnight Background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 2. Isometric Clearing Rings (Perspective Ellipses on Ground)
    ctx.save();
    for (let k = 1; k <= 3; k++) {
      const rx = floorRx * (0.35 + k * 0.22);
      const ry = floorRy * (0.35 + k * 0.22);
      ctx.strokeStyle = k === 2 ? 'rgba(217, 32, 39, 0.08)' : 'rgba(236, 228, 214, 0.025)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, floorCY, rx, ry, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // 3. Central Firepit & Glowing Hearth (Warmth Radiating on Ground)
    const breath = Math.sin(t * 0.75) * 0.12 + Math.sin(t * 1.5) * 0.05;
    const fireRadiusX = 135 * (1.0 + breath);
    const fireRadiusY = 48 * (1.0 + breath);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hearthGrad = ctx.createRadialGradient(cx, floorCY, 0, cx, floorCY, fireRadiusX);
    hearthGrad.addColorStop(0.0, 'rgba(255, 236, 210, 0.40)'); // White-hot heart
    hearthGrad.addColorStop(0.28, 'rgba(255, 178, 102, 0.25)'); // Amber flame
    hearthGrad.addColorStop(0.68, 'rgba(217, 32, 39, 0.10)');  // Deep embers
    hearthGrad.addColorStop(1.0, 'rgba(5, 5, 5, 0.0)');

    ctx.fillStyle = hearthGrad;
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, fireRadiusX * 1.4, fireRadiusY * 1.4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Firepit stone rim (isometric ellipse)
    ctx.strokeStyle = 'rgba(255, 178, 102, 0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, 58, 20, 0, 0, TAU);
    ctx.stroke();

    // 4. Convection Embers rising from hearth into upper night sky
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life += 1;
      if (e.life >= e.maxLife) {
        Object.assign(e, createEmber());
      }
      const p = e.life / e.maxLife;
      // Gentle spiral convection around the vertical heat plume
      const swirl = Math.sin(t * 1.8 + e.spiralOffset) * 0.6;
      e.vx += swirl * 0.04;
      e.vx *= 0.95;
      e.x += e.vx;
      e.y += e.vy;

      const alpha = p < 0.25 ? p / 0.25 : (1.0 - p);
      const col = p < 0.35
        ? `rgba(255, 236, 210, ${alpha * 0.85})`
        : p < 0.7
        ? `rgba(255, 178, 102, ${alpha * 0.70})`
        : `rgba(217, 32, 39, ${alpha * 0.45})`;

      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size * (1 - p * 0.35), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 5. Transient Flight Sparks from Seats
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      const elapsed = now - sp.born;
      if (elapsed >= sp.duration) {
        sparks.splice(i, 1);
        continue;
      }
      const q = elapsed / sp.duration;
      const ease = 1 - Math.pow(1 - q, 3);
      // Soft parabolic arc over the hearth
      const midX = (sp.sx + sp.tx) / 2;
      const midY = Math.min(sp.sy, sp.ty) - 45;
      const u = 1 - ease;
      const x = u * u * sp.sx + 2 * u * ease * midX + ease * ease * sp.tx;
      const y = u * u * sp.sy + 2 * u * ease * midY + ease * ease * sp.ty;

      ctx.save();
      ctx.fillStyle = `rgba(255, 178, 102, ${0.9 * (1 - q * 0.7)})`;
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x, y, 2.5 * (1 - q * 0.5), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // 6. Smooth Silk Ribbon Weaving Across Spoken Feelings
    if (feelings.length >= 2) {
      for (let i = 0; i < feelings.length - 1; i++) {
        const p0 = i > 0 ? feelings[i - 1] : feelings[i];
        const p1 = feelings[i];
        const p2 = feelings[i + 1];
        const p3 = i < feelings.length - 2 ? feelings[i + 2] : p2;

        // Catmull-Rom smooth tangents: ZERO sharp corners, perfect C1 continuity
        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        // Subtle thermal breathing wave
        const wave = Math.sin(t * 1.2 + i * 0.7) * 2.5;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.bezierCurveTo(cp1x, cp1y + wave, cp2x, cp2y - wave, p2.x, p2.y);

        const recency = (i + 1) / feelings.length;
        if (recency > 0.65) {
          ctx.strokeStyle = `rgba(255, 178, 102, ${0.45 + recency * 0.45})`;
          ctx.lineWidth = 1.4;
          ctx.shadowColor = '#ffb266';
          ctx.shadowBlur = 8;
        } else if (recency > 0.3) {
          ctx.strokeStyle = `rgba(217, 32, 39, ${0.25 + recency * 0.35})`;
          ctx.lineWidth = 1.0;
          ctx.shadowColor = '#d92027';
          ctx.shadowBlur = 4;
        } else {
          ctx.strokeStyle = `rgba(236, 228, 214, ${0.12 + recency * 0.18})`;
          ctx.lineWidth = 0.8;
          ctx.setLineDash([3, 5]);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // 7. Draw Seats on the Clearing Ring
    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      const isActive = i === activeSeat;
      if (s.pulse > 0) s.pulse -= 0.02;

      // Perspective scaling: far seats are smaller (3px), near seats are larger (5.5px)
      const baseR = 3.2 + s.depth * 2.4;

      // Seat ember/dot
      ctx.beginPath();
      ctx.arc(s.x, s.y, isActive ? baseR + 2 : baseR, 0, TAU);
      ctx.fillStyle = isActive ? '#ffb266' : s.spokenCount > 0 ? '#997c5e' : '#241c14';
      ctx.fill();

      // Active speaker aura
      if (isActive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, baseR + 8 + Math.sin(t * 3) * 1.5, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      // Pass indicator: dark quiet bead
      if (s.hasPassed) {
        ctx.fillStyle = '#3a2e22';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 12, 3, 0, TAU);
        ctx.fill();
      }

      // Seat label
      ctx.fillStyle = isActive ? '#ffb266' : '#524335';
      ctx.font = '10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelDist = 20 + s.depth * 8;
      const lx = s.x + Math.cos(s.angle) * labelDist;
      const ly = s.y + Math.sin(s.angle) * (labelDist * 0.6);
      ctx.fillText(`[${String(i + 1).padStart(2, '0')}]`, lx, ly);
    }

    // 8. Update and Draw Settled Feelings (BESIDE SEATS, CALM & NO JITTER)
    for (let i = 0; i < feelings.length; i++) {
      const f = feelings[i];

      // Smooth arrival to target position, then calm settling
      if (!f.settled) {
        f.x += (f.targetX - f.x) * 0.08;
        f.y += (f.targetY - f.y) * 0.08;
        if (Math.hypot(f.targetX - f.x, f.targetY - f.y) < 1.5) {
          f.settled = true;
        }
      } else {
        // Gentle peaceful breathing (no jittering or fighting forces)
        f.y = f.targetY + Math.sin(t * 0.8 + i) * 1.2;
      }

      ctx.save();
      ctx.translate(f.x, f.y);

      const label = f.count > 1 ? `${f.lemma} ×${f.count}` : f.lemma;
      ctx.font = "11.5px 'JetBrains Mono'";
      const textMetrics = ctx.measureText(label);
      const bgW = textMetrics.width + 16;
      const halfW = bgW / 2;

      // Clean, calm, readable pill
      ctx.fillStyle = 'rgba(9, 7, 5, 0.92)';
      ctx.strokeStyle = f === lastSpokenNode ? 'rgba(255, 178, 102, 0.55)' : 'rgba(236, 228, 214, 0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-halfW, -11, bgW, 22, 2);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = f === lastSpokenNode ? '#ffb266' : '#ece4d6';
      if (f === lastSpokenNode) {
        ctx.shadowColor = '#ffb266';
        ctx.shadowBlur = 8;
      }
      ctx.fillText(label, 0, 0);

      ctx.restore();
    }

    // 9. Update and Draw Desires (LANTERNS FLOATING IN THE NIGHT SKY)
    for (let i = 0; i < desires.length; i++) {
      const d = desires[i];

      // Rise smoothly towards the upper sky
      if (!d.settled) {
        d.x += (d.targetX - d.x) * 0.04;
        d.y += (d.targetY - d.y) * 0.04;
        if (Math.hypot(d.targetX - d.x, d.targetY - d.y) < 4) {
          d.settled = true;
        }
      } else {
        // Peaceful horizontal drift like stars/lanterns
        d.x = d.targetX + Math.sin(t * 0.6 + i * 1.4) * 3;
        d.y = d.targetY + Math.cos(t * 0.5 + i * 1.1) * 2;
      }

      ctx.save();
      ctx.translate(d.x, d.y);

      ctx.font = "11.5px 'JetBrains Mono'";
      const metrics = ctx.measureText(d.text);
      const bgW = metrics.width + 16;
      const halfW = bgW / 2;

      // Glowing warm lantern badge
      ctx.fillStyle = 'rgba(14, 10, 6, 0.90)';
      ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(-halfW, -11, bgW, 22, 2);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffb266';
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 10;
      ctx.fillText(d.text, 0, 0);

      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // Meditative, Organic Circle Journey (8-10 meaningful utterances with real silence)
  const MEDITATIVE_CIRCLE_JOURNEY = [
    { seat: 0, text: 'замедление', family: 'спокойствие', pause: 5000, p: 2 },
    { seat: 2, text: 'волнение в груди', family: 'тревога', pause: 6000, p: 2 },
    { seat: 4, text: 'ком в горле', family: 'тело', pause: 5500, p: 2 },
    { seat: 6, text: 'пас', kind: 'pass', pause: 3500, p: 2 },
    { seat: 8, text: 'тепло от ваших слов', family: 'нежность', pause: 6500, p: 2 },
    { seat: 10, text: 'сильная усталость', family: 'усталость', pause: 6000, p: 2 },
    { seat: 1, text: 'растерянность', family: 'растерянность', pause: 5500, p: 2 },
    { seat: 5, text: 'благодарность за честность', family: 'нежность', pause: 5500, p: 2 },
    // Phase 3: Desires rising into the sky
    { seat: 2, text: 'тишины и выдоха', kind: 'desire', pause: 6000, p: 3 },
    { seat: 8, text: 'побыть с собой', kind: 'desire', pause: 6000, p: 3 },
    { seat: 5, text: 'просто помолчать рядом', kind: 'desire', pause: 6000, p: 3 },
    { seat: 10, text: 'тепла в теле', kind: 'desire', pause: 6000, p: 3 }
  ];

  let journeyIdx = 0;
  let autoTimer = null;

  function triggerNextTurn() {
    if (journeyIdx >= MEDITATIVE_CIRCLE_JOURNEY.length) {
      // Circle completed peacefully, hold in presence
      if (autoTimer) clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
      statusLabel.textContent = '04 · круг завершён · тишина у огня';
      return;
    }
    const step = MEDITATIVE_CIRCLE_JOURNEY[journeyIdx++];
    if (step.p && step.p !== phase) {
      setPhase(step.p);
    }
    addWord(step.text, step.family, step.kind || 'feeling', step.seat);
  }

  function toggleAutoDemo() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
    } else {
      btnAutoDemo.classList.add('active');
      const runStep = () => {
        triggerNextTurn();
        if (journeyIdx < MEDITATIVE_CIRCLE_JOURNEY.length) {
          const pause = MEDITATIVE_CIRCLE_JOURNEY[journeyIdx - 1]?.pause || 5000;
          autoTimer = setTimeout(runStep, pause);
        }
      };
      runStep();
    }
  }

  function setPhase(p) {
    phase = p;
    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.phase, 10) === phase);
    });
    updateStatus();
  }

  // Interactivity
  btnNext.addEventListener('click', triggerNextTurn);
  btnAutoDemo.addEventListener('click', toggleAutoDemo);

  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.addEventListener('click', () => setPhase(parseInt(btn.dataset.phase, 10)));
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      addWord(chip.dataset.text, chip.dataset.family, chip.dataset.kind || 'feeling');
    });
  });

  // Click seat to focus
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      if (Math.hypot(clickX - s.x, clickY - s.y) < 28) {
        activeSeat = i;
        s.pulse = 1.0;
        updateStatus();
        break;
      }
    }
  });

  // Keyboard Hotkeys
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      triggerNextTurn();
    } else if (e.key === 'm' || e.key === 'ь') {
      toggleAudio();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      setPhase(parseInt(e.key, 10));
    }
  });

  // Seed with quiet hearth
  requestAnimationFrame(render);
})();
</script>

</body>
</html>
