<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Салон присутствия — 04: Созерцательный пиксельный костёр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050505;
      color: #ece4d6;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(255, 178, 102, 0.12);
      border: 1px solid rgba(255, 178, 102, 0.35);
      color: #ffb266;
      border-radius: 2px;
      font-weight: 700;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #ffb266;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb266;
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9.4;
      background: #050505;
      border: 1px solid #181410;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95);
    }
    canvas { width: 100%; height: 100%; display: block; cursor: default; }
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: #090807;
      border: 1px solid #1a1612;
      border-radius: 2px;
      font-size: 11px;
    }
    button {
      background: #14100c;
      border: 1px solid #2a2016;
      color: #ece4d6;
      padding: 6px 12px;
      border-radius: 2px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #221810; border-color: #ffb266; color: #fff; }
    button.active { background: #ffb266; border-color: #ffb266; color: #050505; font-weight: 700; }
    .phrase-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .chip {
      background: #100d0a;
      border: 1px solid #241c14;
      color: #8a7e70;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: #ffb266; color: #ffb266; }
    .info-bar {
      font-size: 10.5px;
      color: #706354;
      line-height: 1.6;
      padding: 0 4px;
    }
    .info-bar kbd {
      background: #15110d;
      border: 1px solid #2b2117;
      padding: 1px 4px;
      border-radius: 2px;
      color: #ece4d6;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-bar">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge"><span class="dot"></span> эксперимент 04</span>
      <span style="font-weight: 600; color:#ece4d6;">созерцательный костёр присутствия</span>
      <span style="color:#605345;">· чистая типографика и угасание слов</span>
    </div>
    <div id="statusLabel" style="color:#ffb266;">02 · круг чувств · голос в круге</div>
  </div>

  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls">
    <button id="btnNext" class="active">
      <span>space</span> реплика в круге (рандом)
    </button>
    <button id="btnAutoDemo">
      <span>▶</span> медитативный живой круг
    </button>
    <button id="btnAudio">
      <span>m</span> звук d dorian
    </button>
    <div style="display:flex; gap:4px; margin-left: 8px;">
      <button class="phase-btn" data-phase="1">1 тишина</button>
      <button class="phase-btn active" data-phase="2">2 чувства</button>
      <button class="phase-btn" data-phase="3">3 желания</button>
      <button class="phase-btn" data-phase="4">4 выход</button>
    </div>
    <div class="phrase-chips">
      <span style="font-size:10px; color:#584b3d; margin-right:4px;">назвать:</span>
      <button class="chip" data-text="тревога" data-family="тревога">тревожно</button>
      <button class="chip" data-text="замедление" data-family="спокойствие">замедление</button>
      <button class="chip" data-text="тепло" data-family="нежность">тепло</button>
      <button class="chip" data-text="усталость" data-family="усталость">устал</button>
      <button class="chip" data-text="тишины" data-kind="desire">✦ тишины</button>
      <button class="chip" data-text="пас" data-kind="pass">пас</button>
    </div>
  </div>

  <div class="info-bar">
    <kbd>space</kbd> — реплика участника · слова мягко угасают со временем (до 10%) без рамок · связи пишутся в хранилище · <kbd>m</kbd> — звук дрона
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const statusLabel = document.getElementById('statusLabel');
  const btnAudio = document.getElementById('btnAudio');
  const btnNext = document.getElementById('btnNext');
  const btnAutoDemo = document.getElementById('btnAutoDemo');

  const TAU = Math.PI * 2;
  const SEATS_COUNT = 12;

  let W, H, cx, floorCY, floorRx, floorRy, skyTop, skyH;
  let activeSeat = 0;
  let lastSpeakerSeat = null;
  let phase = 2; // 1: silence, 2: feelings, 3: desires, 4: completion

  // True Isometric Geometry
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.width = Math.round(rect.width * dpr);
    H = canvas.height = Math.round(rect.height * dpr);

    cx = W / 2;
    floorCY = H * 0.65;
    floorRx = Math.min(W * 0.41, 490 * dpr);
    floorRy = Math.min(H * 0.20, 140 * dpr);

    skyTop = 40 * dpr;
    skyH = H * 0.28;

    layoutSeats();
  }

  const seats = [];
  function layoutSeats() {
    seats.length = 0;
    for (let i = 0; i < SEATS_COUNT; i++) {
      const ang = (i / SEATS_COUNT) * TAU + Math.PI / 2;
      const x = cx + Math.cos(ang) * floorRx;
      const y = floorCY + Math.sin(ang) * floorRy;
      const depth = (Math.sin(ang) + 1) / 2; // 0 (far) .. 1 (near)

      seats.push({
        id: i,
        angle: ang,
        x,
        y,
        depth,
        pulse: 0,
        spokenCount: 0,
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // =========================================================================
  // PIXELATED COZY CAMPFIRE (Warm, muted, atmospheric)
  // =========================================================================

  const FIRE_W = 46;
  const FIRE_H = 36;
  const fireBuffer = document.createElement('canvas');
  fireBuffer.width = FIRE_W;
  fireBuffer.height = FIRE_H;
  const fireCtx = fireBuffer.getContext('2d');
  const fireImg = fireCtx.createImageData(FIRE_W, FIRE_H);
  const firePixels = fireImg.data;
  const fireHeat = new Uint8Array(FIRE_W * FIRE_H);

  // 37-color warm ember palette (reduced blinding white, deeper cozy amber & wine)
  const FIRE_PALETTE = [
    [0, 0, 0, 0],
    [8, 6, 5, 140],
    [26, 8, 6, 190],
    [42, 12, 6, 230],
    [58, 14, 6, 240],
    [74, 18, 6, 245],
    [90, 22, 6, 250],
    [106, 26, 6, 255],
    [122, 32, 6, 255],
    [138, 38, 7, 255],
    [154, 46, 7, 255],
    [168, 54, 8, 255],
    [180, 62, 9, 255],
    [192, 72, 10, 255],
    [202, 82, 12, 255],
    [210, 92, 14, 255],
    [216, 102, 16, 255],
    [222, 112, 18, 255],
    [226, 120, 22, 255],
    [228, 128, 26, 255],
    [230, 136, 30, 255],
    [232, 144, 36, 255],
    [234, 152, 42, 255],
    [236, 160, 48, 255],
    [238, 168, 56, 255],
    [240, 176, 64, 255],
    [242, 184, 72, 255],
    [244, 192, 82, 255],
    [246, 200, 92, 255],
    [248, 208, 104, 255],
    [250, 214, 116, 255],
    [252, 220, 130, 255],
    [252, 226, 146, 255],
    [254, 232, 162, 255],
    [254, 238, 180, 255],
    [255, 244, 200, 255],
    [255, 248, 215, 255]
  ];

  function updatePixelFire() {
    const center = FIRE_W / 2;
    for (let x = 0; x < FIRE_W; x++) {
      const dist = Math.abs(x - center);
      const rowIdx1 = (FIRE_H - 1) * FIRE_W + x;
      const rowIdx2 = (FIRE_H - 2) * FIRE_W + x;
      if (dist < 9) {
        fireHeat[rowIdx1] = 36;
        fireHeat[rowIdx2] = Math.random() < 0.8 ? 35 : 32;
      } else if (dist < 15) {
        fireHeat[rowIdx1] = Math.random() < 0.55 ? 28 : 14;
        fireHeat[rowIdx2] = Math.random() < 0.35 ? 20 : 8;
      } else {
        fireHeat[rowIdx1] = 0;
        fireHeat[rowIdx2] = 0;
      }
    }

    for (let y = 0; y < FIRE_H - 2; y++) {
      for (let x = 0; x < FIRE_W; x++) {
        const fromIdx = (y + 1) * FIRE_W + x;
        const heat = fireHeat[fromIdx];
        if (heat === 0) {
          fireHeat[y * FIRE_W + x] = 0;
        } else {
          const decay = Math.floor(Math.random() * 2.9);
          const drift = (Math.floor(Math.random() * 3) - 1);
          const toX = Math.min(FIRE_W - 1, Math.max(0, x + drift));
          const toIdx = y * FIRE_W + toX;
          fireHeat[toIdx] = Math.max(0, heat - decay);
        }
      }
    }

    for (let i = 0; i < FIRE_W * FIRE_H; i++) {
      const h = fireHeat[i];
      const col = FIRE_PALETTE[h] || FIRE_PALETTE[0];
      const pxIdx = i * 4;
      firePixels[pxIdx] = col[0];
      firePixels[pxIdx + 1] = col[1];
      firePixels[pxIdx + 2] = col[2];
      firePixels[pxIdx + 3] = col[3];
    }
    fireCtx.putImageData(fireImg, 0, 0);
  }

  // Pixelated Micro-Embers (Crisp square pixel particles)
  const EMBER_COUNT = 45;
  const pixelEmbers = [];
  function createPixelEmber() {
    return {
      x: cx + (Math.random() - 0.5) * 40,
      y: floorCY - 8 + (Math.random() - 0.5) * 12,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -0.7 - Math.random() * 1.4,
      size: Math.random() < 0.7 ? 2 : 3,
      life: Math.random() * 120,
      maxLife: 75 + Math.random() * 110,
      color: Math.random() < 0.5 ? '#ffb266' : '#d95a2b'
    };
  }
  for (let i = 0; i < EMBER_COUNT; i++) {
    pixelEmbers.push(createPixelEmber());
  }

  // =========================================================================
  // DATA STRUCTURES: Words, Opacity Aging, LocalStorage Graph (NO LINES)
  // =========================================================================

  const feelings = []; // Pure floating words beside seats
  const desires = [];  // Floating sky words
  const sparks = [];   // Transient flight sparks: seat -> word (1.2s)
  let lastSpokenNode = null;

  // Persist graph connection into localStorage as data without drawing lines
  function recordLinkInStorage(srcNode, tgtNode) {
    try {
      const key = 'salon_presence_links';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.push({
        fromSeat: srcNode.seatId,
        toSeat: tgtNode.seatId,
        fromWord: srcNode.lemma || srcNode.text,
        toWord: tgtNode.lemma || tgtNode.text,
        phase,
        timestamp: Date.now()
      });
      // Cap at last 200 edges
      if (existing.length > 200) existing.splice(0, existing.length - 200);
      localStorage.setItem(key, JSON.stringify(existing));
    } catch (e) {
      // ignore storage quotas
    }
  }

  function agePreviousPhrases() {
    // Opacity fades by 0.02 with each new utterance; floor is 0.10 (never disappears completely)
    for (let i = 0; i < feelings.length; i++) {
      feelings[i].opacity = Math.max(0.10, feelings[i].opacity - 0.02);
    }
    for (let i = 0; i < desires.length; i++) {
      desires[i].opacity = Math.max(0.10, desires[i].opacity - 0.02);
    }
  }

  function pickRandomSpeaker(excludeSeat) {
    const candidates = [];
    for (let i = 0; i < SEATS_COUNT; i++) {
      if (i !== excludeSeat) {
        const dist = Math.abs(i - excludeSeat);
        if (dist >= 2 && dist <= (SEATS_COUNT - 2)) {
          candidates.push(i);
          candidates.push(i);
        } else {
          candidates.push(i);
        }
      }
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function addWord(text, family, kind = 'feeling', chosenSeat = null) {
    const prevSpeaker = activeSeat;
    const speakerSeat = chosenSeat !== null && chosenSeat !== undefined
      ? chosenSeat
      : pickRandomSpeaker(prevSpeaker);

    activeSeat = speakerSeat;
    const seat = seats[activeSeat];
    seat.pulse = 1.0;
    seat.spokenCount++;

    const now = performance.now();

    // Age all previous words by 0.02
    agePreviousPhrases();

    if (kind === 'pass') {
      seat.hasPassed = true;
      if (audioOn) playPass();
      lastSpeakerSeat = activeSeat;
      updateStatus();
      return;
    }

    if (kind === 'desire') {
      const k = desires.length;
      const frac = v => v - Math.floor(v);
      const targetX = cx + (frac(0.24 + k * 0.618034) - 0.5) * (floorRx * 2.1);
      const targetY = skyTop + frac(0.40 + k * 0.381966) * skyH;

      const lo = {
        text: '✦ ' + text,
        seatId: activeSeat,
        x: seat.x,
        y: seat.y - 15,
        targetX,
        targetY,
        vx: 0,
        vy: -1.0,
        settled: false,
        born: now,
        opacity: 1.0, // Freshly spoken
      };

      if (lastSpokenNode) {
        recordLinkInStorage(lastSpokenNode, lo);
      }

      desires.push(lo);

      sparks.push({
        sx: seat.x, sy: seat.y,
        tx: targetX, ty: targetY,
        born: now, duration: 1200
      });

      lastSpokenNode = lo;
      lastSpeakerSeat = activeSeat;

      if (audioOn) playBell();
      updateStatus();
      return;
    }

    // Feeling word beside the speaker's seat
    let existing = feelings.find(f => f.lemma === text && f.seatId === activeSeat);
    if (existing) {
      existing.count++;
      existing.lastAt = now;
      existing.pulse = 1.0;
      existing.opacity = 1.0; // Rekindled with warmth

      if (lastSpokenNode && lastSpokenNode !== existing) {
        recordLinkInStorage(lastSpokenNode, existing);
      }

      lastSpokenNode = existing;
      lastSpeakerSeat = activeSeat;

      if (audioOn) playChime(activeSeat);
      updateStatus();
      return;
    }

    const outAngle = seat.angle;
    const outDist = 34 + (seat.spokenCount % 2) * 16;
    const targetX = seat.x + Math.cos(outAngle) * outDist;
    const targetY = seat.y + Math.sin(outAngle) * (outDist * 0.65) - 6;

    const newFeeling = {
      lemma: text,
      family: family || 'спокойствие',
      seatId: activeSeat,
      x: seat.x,
      y: seat.y,
      targetX,
      targetY,
      born: now,
      lastAt: now,
      pulse: 1.0,
      count: 1,
      settled: false,
      opacity: 1.0, // Initial opacity 1.0
    };

    // Store relationship as data in localStorage (NO visual lines)
    if (lastSpokenNode) {
      recordLinkInStorage(lastSpokenNode, newFeeling);
    }

    feelings.push(newFeeling);

    sparks.push({
      sx: seat.x, sy: seat.y,
      tx: targetX, ty: targetY,
      born: now, duration: 1200
    });

    lastSpokenNode = newFeeling;
    lastSpeakerSeat = activeSeat;

    if (audioOn) playChime(activeSeat);
    updateStatus();
  }

  function updateStatus() {
    const phases = ['01 · тишина', '02 · круг чувств', '03 · чего хочется', '04 · выход'];
    const prevStr = lastSpeakerSeat !== null ? `от [${String(lastSpeakerSeat + 1).padStart(2, '0')}] к ` : '';
    statusLabel.textContent = `${phases[phase - 1]} · ${prevStr}место [${String(activeSeat + 1).padStart(2, '0')}]`;
  }

  // Audio Engine: Procedural D Dorian Drone
  let audioCtx = null;
  let audioOn = false;
  let droneGain = null;

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = audioCtx.createGain();
    droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
    droneGain.connect(audioCtx.destination);

    const osc1 = audioCtx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime);

    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(293.66, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(320, audioCtx.currentTime);

    const subGain = audioCtx.createGain();
    subGain.gain.value = 0.35;
    osc2.connect(subGain);
    subGain.connect(filter);
    osc1.connect(filter);
    filter.connect(droneGain);

    osc1.start();
    osc2.start();
  }

  function toggleAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    btnAudio.classList.toggle('active', audioOn);
    if (audioOn) {
      droneGain.gain.setTargetAtTime(0.07, audioCtx.currentTime, 1.5);
    } else {
      droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
  }

  function playChime(seatIdx) {
    if (!audioCtx || !audioOn) return;
    const notes = [146.83, 164.81, 174.61, 196.0, 220.0, 246.94, 261.63, 293.66];
    const freq = notes[seatIdx % notes.length] * 2;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.11, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 3.4);
  }

  function playBell() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 4.8);
  }

  function playPass() {
    if (!audioCtx || !audioOn) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110.0, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2.2);
  }

  btnAudio.addEventListener('click', toggleAudio);

  // =========================================================================
  // MAIN RENDER LOOP (Clean, calm, pure typography, no lines, no boxes)
  // =========================================================================

  function render(time) {
    const t = time * 0.001;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // 1. Dark warm clearing background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 2. Isometric Clearing Rings on Ground (subtle atmosphere)
    ctx.save();
    for (let k = 1; k <= 3; k++) {
      const rx = floorRx * (0.35 + k * 0.22);
      const ry = floorRy * (0.35 + k * 0.22);
      ctx.strokeStyle = k === 2 ? 'rgba(255, 178, 102, 0.04)' : 'rgba(236, 228, 214, 0.018)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, floorCY, rx, ry, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // 3. Central Fire Ground Illumination (Soft, warm, muted glow)
    const flicker = Math.sin(t * 10) * 0.02 + Math.sin(t * 5.5) * 0.03 + Math.sin(t * 1.5) * 0.05;
    const poolRadiusX = (135 + flicker * 25);
    const poolRadiusY = (50 + flicker * 10);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const poolGrad = ctx.createRadialGradient(cx, floorCY, 0, cx, floorCY, poolRadiusX);
    poolGrad.addColorStop(0.0, 'rgba(255, 205, 150, 0.20)'); // softened brightness
    poolGrad.addColorStop(0.40, 'rgba(215, 120, 50, 0.12)');
    poolGrad.addColorStop(0.75, 'rgba(120, 30, 10, 0.04)');
    poolGrad.addColorStop(1.0, 'rgba(5, 5, 5, 0.0)');
    ctx.fillStyle = poolGrad;
    ctx.beginPath();
    ctx.ellipse(cx, floorCY, poolRadiusX * 1.35, poolRadiusY * 1.35, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 4. Pixelated Ash Bed & Charred Logs
    ctx.save();
    ctx.fillStyle = '#0d0a08';
    ctx.beginPath();
    ctx.ellipse(cx, floorCY + 4, 48, 16, 0, 0, TAU);
    ctx.fill();

    const logAngles = [-0.65, 0.85, 2.35, 3.85];
    for (let i = 0; i < logAngles.length; i++) {
      const a = logAngles[i];
      const lx1 = cx + Math.cos(a) * 30;
      const ly1 = floorCY + 4 + Math.sin(a) * 10;
      const lx2 = cx - Math.cos(a) * 30;
      const ly2 = floorCY + 4 - Math.sin(a) * 10;

      ctx.strokeStyle = '#16100a';
      ctx.lineWidth = 6;
      ctx.lineCap = 'square';
      ctx.beginPath();
      ctx.moveTo(lx1, ly1);
      ctx.lineTo(lx2, ly2);
      ctx.stroke();

      // Glowing ember pixel veins inside logs
      ctx.strokeStyle = 'rgba(235, 120, 35, 0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + (lx1 - cx) * 0.35, floorCY + 4 + (ly1 - (floorCY + 4)) * 0.35);
      ctx.lineTo(cx + (lx2 - cx) * 0.35, floorCY + 4 + (ly2 - (floorCY + 4)) * 0.35);
      ctx.stroke();
    }
    ctx.restore();

    // 5. UPDATE & DRAW COZY PIXELATED CAMPFIRE
    updatePixelFire();

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    const pixelScale = 3.4;
    const pW = FIRE_W * pixelScale;
    const pH = FIRE_H * pixelScale;
    const pX = cx - pW / 2;
    const pY = floorCY - pH + 10;

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.88; // cozy, not blinding
    ctx.drawImage(fireBuffer, pX, pY, pW, pH);
    ctx.restore();

    // 6. Pixelated Micro-Embers (Square retro embers rising into sky)
    ctx.save();
    for (let i = 0; i < pixelEmbers.length; i++) {
      const e = pixelEmbers[i];
      e.life++;
      if (e.life >= e.maxLife) {
        Object.assign(e, createPixelEmber());
      }
      const p = e.life / e.maxLife;
      e.x += e.vx + (Math.sin(t * 3 + i) * 0.2);
      e.y += e.vy;

      const alpha = p < 0.2 ? p / 0.2 : (1 - p);
      ctx.fillStyle = e.color;
      ctx.globalAlpha = alpha * 0.75;
      ctx.fillRect(Math.round(e.x), Math.round(e.y), e.size, e.size);
    }
    ctx.restore();

    // 7. Transient Flight Sparks from Seats
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      const elapsed = now - sp.born;
      if (elapsed >= sp.duration) {
        sparks.splice(i, 1);
        continue;
      }
      const q = elapsed / sp.duration;
      const ease = 1 - Math.pow(1 - q, 3);
      const midX = (sp.sx + sp.tx) / 2;
      const midY = Math.min(sp.sy, sp.ty) - 35;
      const u = 1 - ease;
      const x = u * u * sp.sx + 2 * u * ease * midX + ease * ease * sp.tx;
      const y = u * u * sp.sy + 2 * u * ease * midY + ease * ease * sp.ty;

      ctx.save();
      ctx.fillStyle = `rgba(255, 178, 102, ${0.85 * (1 - q * 0.7)})`;
      ctx.shadowColor = '#ffb266';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, 2.0 * (1 - q * 0.5), 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // 8. Draw Seats Ring
    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      const isActive = i === activeSeat;
      if (s.pulse > 0) s.pulse -= 0.02;

      const baseR = 3.2 + s.depth * 2.2;

      ctx.beginPath();
      ctx.arc(s.x, s.y, isActive ? baseR + 2 : baseR, 0, TAU);
      ctx.fillStyle = isActive ? '#ffb266' : s.spokenCount > 0 ? '#8a6e52' : '#221912';
      ctx.fill();

      if (isActive) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 178, 102, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, baseR + 7 + Math.sin(t * 3) * 1.2, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (s.hasPassed) {
        ctx.fillStyle = '#34281d';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 11, 2.5, 0, TAU);
        ctx.fill();
      }

      ctx.fillStyle = isActive ? '#ffb266' : '#4d3d2f';
      ctx.font = '9.5px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelDist = 18 + s.depth * 8;
      const lx = s.x + Math.cos(s.angle) * labelDist;
      const ly = s.y + Math.sin(s.angle) * (labelDist * 0.6);
      ctx.fillText(`[${String(i + 1).padStart(2, '0')}]`, lx, ly);
    }

    // 9. Update & Render Settled Feelings (PURE FLOATING TYPOGRAPHY, NO BOX BORDERS, FADING DOWN TO 10%)
    for (let i = 0; i < feelings.length; i++) {
      const f = feelings[i];
      if (!f.settled) {
        f.x += (f.targetX - f.x) * 0.07;
        f.y += (f.targetY - f.y) * 0.07;
        if (Math.hypot(f.targetX - f.x, f.targetY - f.y) < 1.2) {
          f.settled = true;
        }
      } else {
        f.y = f.targetY + Math.sin(t * 0.75 + i) * 0.8;
      }

      ctx.save();
      ctx.translate(f.x, f.y);

      const label = f.count > 1 ? `${f.lemma} ×${f.count}` : f.lemma;
      ctx.font = "12px 'JetBrains Mono'";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const isLatest = f === lastSpokenNode;
      const alpha = Math.max(0.10, f.opacity);

      // Clean floating typography without UI boxes!
      if (isLatest) {
        ctx.fillStyle = `rgba(255, 178, 102, ${alpha})`;
        ctx.shadowColor = 'rgba(255, 178, 102, 0.65)';
        ctx.shadowBlur = 10;
      } else {
        ctx.fillStyle = `rgba(236, 228, 214, ${alpha * 0.90})`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 4;
      }

      ctx.fillText(label, 0, 0);
      ctx.restore();
    }

    // 10. Update & Render Desires (PURE FLOATING SKY TYPOGRAPHY, NO BOXES, FADING DOWN TO 10%)
    for (let i = 0; i < desires.length; i++) {
      const d = desires[i];
      if (!d.settled) {
        d.x += (d.targetX - d.x) * 0.04;
        d.y += (d.targetY - d.y) * 0.04;
        if (Math.hypot(d.targetX - d.x, d.targetY - d.y) < 3) {
          d.settled = true;
        }
      } else {
        d.x = d.targetX + Math.sin(t * 0.45 + i * 1.3) * 2.5;
        d.y = d.targetY + Math.cos(t * 0.35 + i * 1.1) * 1.8;
      }

      ctx.save();
      ctx.translate(d.x, d.y);

      ctx.font = "12px 'JetBrains Mono'";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const isLatest = d === lastSpokenNode;
      const alpha = Math.max(0.10, d.opacity);

      if (isLatest) {
        ctx.fillStyle = `rgba(255, 178, 102, ${alpha})`;
        ctx.shadowColor = 'rgba(255, 178, 102, 0.7)';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = `rgba(255, 195, 130, ${alpha * 0.85})`;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 4;
      }

      ctx.fillText(d.text, 0, 0);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  // =========================================================================
  // NATURAL RANDOM CONVERSATION LOOP
  // =========================================================================

  const RICH_LEXICON = [
    { text: 'замедление', family: 'спокойствие' },
    { text: 'волнение в груди', family: 'тревога' },
    { text: 'ком в горле', family: 'тело' },
    { text: 'тепло от ваших слов', family: 'нежность' },
    { text: 'сильная усталость', family: 'усталость' },
    { text: 'растерянность', family: 'растерянность' },
    { text: 'благодарность за честность', family: 'нежность' },
    { text: 'отпускает напряжение', family: 'спокойствие' },
    { text: 'пас', kind: 'pass' },
    { text: 'живость', family: 'радость' },
    { text: 'глубокий вдох', family: 'тело' },
    { text: 'ясность', family: 'спокойствие' },
    { text: 'тишины и выдоха', kind: 'desire' },
    { text: 'побыть с собой', kind: 'desire' },
    { text: 'просто помолчать рядом', kind: 'desire' },
    { text: 'тепла в теле', kind: 'desire' }
  ];

  let turnCount = 0;
  let autoTimer = null;

  function triggerNextTurn() {
    const item = RICH_LEXICON[turnCount % RICH_LEXICON.length];
    turnCount++;

    if (turnCount > 8 && turnCount <= 12 && phase !== 3) {
      setPhase(3);
    } else if (turnCount > 12 && phase !== 4) {
      setPhase(4);
    }

    const nextSpeaker = pickRandomSpeaker(activeSeat);
    addWord(item.text, item.family, item.kind || 'feeling', nextSpeaker);
  }

  function toggleAutoDemo() {
    if (autoTimer) {
      clearTimeout(autoTimer);
      autoTimer = null;
      btnAutoDemo.classList.remove('active');
    } else {
      btnAutoDemo.classList.add('active');
      const step = () => {
        triggerNextTurn();
        autoTimer = setTimeout(step, 5500);
      };
      step();
    }
  }

  function setPhase(p) {
    phase = p;
    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.phase, 10) === phase);
    });
    updateStatus();
  }

  // Interactivity
  btnNext.addEventListener('click', triggerNextTurn);
  btnAutoDemo.addEventListener('click', toggleAutoDemo);

  document.querySelectorAll('.phase-btn').forEach(btn => {
    btn.addEventListener('click', () => setPhase(parseInt(btn.dataset.phase, 10)));
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const nextSpeaker = pickRandomSpeaker(activeSeat);
      addWord(chip.dataset.text, chip.dataset.family, chip.dataset.kind || 'feeling', nextSpeaker);
    });
  });

  // Click seat to focus
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    for (let i = 0; i < seats.length; i++) {
      const s = seats[i];
      if (Math.hypot(clickX - s.x, clickY - s.y) < 28) {
        activeSeat = i;
        s.pulse = 1.0;
        updateStatus();
        break;
      }
    }
  });

  // Keyboard Hotkeys
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      triggerNextTurn();
    } else if (e.key === 'm' || e.key === 'ь') {
      toggleAudio();
    } else if (['1', '2', '3', '4'].includes(e.key)) {
      setPhase(parseInt(e.key, 10));
    }
  });

  requestAnimationFrame(render);
})();
</script>
